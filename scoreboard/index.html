async function startWith(name, source){
  S.onboard={value:name, err:null, busy:true}; render();
  const err=await adoptUser(name, source);
  if(err){ S.onboard={value:name, err, busy:false}; render(); }
}

   RENDER — root

function syncHeader(){
  $("#wklab").textContent = "WEEK "+(S.week??"—");
  const past = S.curWeek!=null && S.week!=null && !isCurrent();
  $(".wk").classList.toggle("past", past);
  $("#now").hidden = !past;
  $("#now").textContent = S.curWeek ? `WEEK ${S.curWeek} →` : "THIS WEEK";
  $("#now").title = "Back to this week";
  $("#stamp").textContent = past ? "" : S.updated ? "UPDATED "+hhmm(S.updated) : "";
  $("#btn").title = S.updated ? `Refresh · updated ${hhmm(S.updated)}, and every ${S.cfg.refresh}s while this week is on` : "Refresh";
  $("#prev").disabled = !!S.demoN || !S.curWeek || S.week<=1;
  $("#next").disabled = !!S.demoN || !S.curWeek || S.week>=S.curWeek;
  const n = isCurrent() ? S.games.filter(g=>g.state==="in").length : 0;
  $("#live").hidden = !n;
  $("#liven").textContent = `${n} LIVE`;
  $("#live").title = `${n} game${n===1?"":"s"} in progress`;
}
function render(){
  syncHeader();
  const e=$("#err"); e.innerHTML="";
  if(S.err){
    const b=el("div","err"); b.appendChild(el("div","t","COULDN'T LOAD"));
    b.appendChild(el("div","d",S.err)); e.appendChild(b);
  }
  const v=$("#view");
  /* a refresh rebuilds everything; put each scrolled list back where the reader left it */
  const keep={}; v.querySelectorAll("[data-k]").forEach(n=>{ keep[n.dataset.k]=n.scrollTop; });
  const keepX={}; v.querySelectorAll("[data-x]").forEach(n=>{ keepX[n.dataset.x]=n.scrollLeft; });
  const navigated=S.anim;
  v.innerHTML=""; v.className="view"+(S.wide?" wide":"");
  if(!S.cfg.username){ renderOnboard(v); renderModal(); return; }
  if(!S.leagues.length){
    v.appendChild(el("div","loading lb", S.err ? "Open settings to fix it" : "Loading rosters and live scores"));
    renderModal(); return;
  }
  S.own=ownership();
  const home=()=>{ const p=el("div","pane home"); renderHome(p); return p; };
  const detail=()=>{ const p=el("div","pane detail"+(S.wide||!S.anim?"":" enter")); renderDetail(p); return p; };
  if(S.wide){ v.appendChild(home()); v.appendChild(detail()); }
  else if(S.view==="detail" && S.leagues.some(l=>l.id===S.league)) v.appendChild(detail());
  else { S.view="home"; v.appendChild(home()); }
  v.querySelectorAll("[data-k]").forEach(n=>{ if(keep[n.dataset.k]) n.scrollTop=keep[n.dataset.k]; });
  const dp=v.querySelector(".pane.detail.flowy");
  if(dp){
    if(S.tabJump!=null){ dp.scrollTop=Math.min(S.tabJump, dp._tabTop()); }
    dp._sync();
  }
  S.tabJump=null;
  if(S.reveal){ const r=S.reveal; S.reveal=null; requestAnimationFrame(()=>reveal(r)); }
  const strip=v.querySelector(".switch.strip");
  if(strip){
    const on=strip.querySelector("[aria-pressed=true]");
    if(navigated || keepX.switch==null){ if(on) strip.scrollLeft=on.offsetLeft-(strip.clientWidth-on.offsetWidth)/2; }
    else strip.scrollLeft=keepX.switch;
  }
  S.anim=false;
  renderModal();
}

/* ============================================================
   ORCHESTRATION
   ============================================================ */
let busy=false, timer=null;
function snapshotPts(){
  const cur={};
  for(const L of S.leagues){ cur[`team:${L.id}`]=L.myPts;
    for(const p of [...(L.mine||[]),...(L.them||[])]) cur[p.pid]=Math.max(cur[p.pid]||0,p.pts); }
  S.deltas={};
  if(isCurrent()) for(const k in cur){ if(S.prevPts[k]!=null){ const d=cur[k]-S.prevPts[k]; if(Math.abs(d)>=0.05) S.deltas[k]=d; } }
  S.prevPts=cur;
}
/* ============================================================
   DEMO — /scoreboard?demo=live
   A Sunday afternoon on your real leagues, for checking the live layout on any
   device or taking screenshots. The earliest game is final, Sunday 1pm games are
   in the fourth quarter, late games in the second or third, night games not started.
   Clocks and points are made up but deterministic, so refreshes agree, and they
   run two game minutes per real minute. Nothing is saved or tracked.
   ============================================================ */
const demoHash = k => { let h=2166136261; for(const c of String(k)){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return ((h>>>0)%10000)/10000; };
function simulateLive(){
  if(!S.demo || !isCurrent() || !S.games.length) return;
  S.demoStart = S.demoStart || Date.now();
  const adv = (Date.now()-S.demoStart)/60000*2;
  const hash = demoHash;
  const games=[...S.games].sort((a,b)=>a.start-b.start), first=games[0].start;
  for(const g of games){
    const day=g.start.getDay(), hr=g.start.getHours()+g.start.getMinutes()/60;
    /* about 5:30pm ET on a Sunday: early games in the fourth quarter, late games in the second or third */
    let played = g.start-first < 3600e3 ? 60 : day===0 && hr<14 ? 46+hash(g.id+"q")*11 : day===0 && hr<17 ? 20+hash(g.id+"q")*16 : -1;
    if(played<0){ Object.assign(g,{state:"pre",period:0,clock:"15:00",homeScore:0,awayScore:0,poss:"",dnd:""}); continue; }
    played=Math.min(60, played+adv);
    const f=played/60;
    g.homeScore=Math.round((10+hash(g.id+"h")*24)*f); g.awayScore=Math.round((10+hash(g.id+"a")*24)*f);
    if(played>=60){ Object.assign(g,{state:"post",period:4,clock:"0:00",poss:"",dnd:""}); continue; }
    const left=15-(played%15), m=Math.floor(left);
    Object.assign(g,{state:"in", period:Math.floor(played/15)+1, clock:`${m}:${String(Math.floor((left-m)*60)).padStart(2,"0")}`,
      poss: hash(g.id+"p"+Math.floor(played/2))<.5 ? g.home : g.away,
      dnd: ["1st & 10","2nd & 7","3rd & 4","3rd & 11","1st & Goal","2nd & 3"][Math.floor(hash(g.id+"d"+Math.floor(played))*6)]});
  }
  S.byTeam={}; for(const g of S.games){ S.byTeam[g.home]=g; S.byTeam[g.away]=g; }
  const ptsFor=(p,L)=>{ const g=S.byTeam[p.team]; if(p.empty||!g||g.state==="pre") return 0;
    const f=g.state==="post"?1:1-fractionLeft(g); return Math.round(projFor(p,L)*f*(0.6+hash(p.pid+"x")*0.85)*10)/10; };   // 60–145% of pace: real swings, not absurd ones
  for(const L of S.leagues){
    if(L.error) continue;
    const sides=new Set([L.mine,L.them,...(L.pairs||[]).flatMap(pr=>pr.teams.map(t=>t.side))]);
    for(const side of sides) for(const p of side||[]) p.pts=ptsFor(p,L);
    const sum=side=>Math.round((side||[]).filter(p=>p.starter).reduce((a,p)=>a+p.pts,0)*100)/100;
    for(const pr of L.pairs||[]) for(const t of pr.teams){ t.pts=sum(t.side); const m=L.matchups.find(x=>x.roster_id===t.roster?.roster_id); if(m) m.points=t.pts; }
    L.myPts=sum(L.mine); L.oppPts=sum(L.them);
  }
}

/* ============================================================
   SAMPLE LEAGUES — /scoreboard?demo=live&leagues=N (or /demo/N)
   For showing what a 4-, 7- or 10-league player sees without their username.
   Everything real that can be: this week's NFL games, players and projections.
   Everything else is invented: league names and formats, team and user names,
   and rosters from a seeded draft, so a given N always looks the same. The demo
   user keeps drafting the same core of favorites, so players overlap across
   leagues the way they do for people in many leagues.
   ============================================================ */
const DEMO_LEAGUES = [
  {name:"Sunday Funday",      teams:12, rec:1,   slots:["QB","RB","RB","WR","WR","TE","FLEX","K","DEF"], me:"Touchback Tacos"},
  {name:"Dynasty Degens",     teams:12, rec:0.5, slots:["QB","RB","RB","WR","WR","WR","TE","FLEX","SUPER_FLEX"], me:"Victory Formation"},
  {name:"Work League",        teams:10, rec:0,   slots:["QB","RB","RB","WR","WR","TE","FLEX","K","DEF"], me:"Clock Killers"},
  {name:"Family Bowl",        teams:10, rec:1,   slots:["QB","RB","RB","WR","WR","TE","FLEX","FLEX","K","DEF"], me:"Garbage Time Legends"},
  {name:"Best Ball Mania",    teams:12, rec:1,   slots:["QB","RB","RB","WR","WR","WR","TE","FLEX"], me:"Trick Play Troupe"},
  {name:"Superflex Society",  teams:12, rec:0.5, slots:["QB","RB","RB","WR","WR","TE","FLEX","SUPER_FLEX","DEF"], me:"Double Coverage"},
  {name:"Guillotine",         teams:12, rec:1,   slots:["QB","RB","RB","WR","WR","TE","FLEX","K","DEF"], me:"Two-Minute Drill"},
  {name:"College Buddies",    teams:10, rec:0.5, slots:["QB","RB","RB","WR","WR","TE","WRRB_FLEX","K","DEF"], me:"End Zone Dancers"},
  {name:"High Stakes",        teams:12, rec:1,   slots:["QB","RB","RB","WR","WR","WR","TE","FLEX","FLEX","DEF"], me:"Goal Line Stand"},
  {name:"Commish Cup",        teams:12, rec:0,   slots:["QB","RB","RB","WR","WR","TE","REC_FLEX","K","DEF"], me:"Fourth Quarter Comeback"},
  {name:"Neighborhood League",teams:10, rec:1,   slots:["QB","RB","RB","WR","WR","TE","FLEX","K","DEF"], me:"Hail Mary Heroes"},
  {name:"Group Chat",         teams:12, rec:0.5, slots:["QB","RB","RB","WR","WR","TE","FLEX","FLEX","DEF"], me:"Blindside Blockers"},
];
const DEMO_TEAMS = ["Sunday Scaries","Red Zone Regulars","Pylon Pushers","Blitz Brigade","Two-Point Tries","The Audibles",
  "Snap Count","Fair Catch Club","Onside Kicks","Pick Sixers","Screen Pass Society","Hurry-Up Offense","Nickel Package",
  "Play Action Heroes","Punt Formation","Waiver Wire Wizards","Taco Tuesday","Gridiron Goats","The Replacements","Bench Mob"];
const DEMO_SCORING = {pass_yd:0.04, pass_td:4, pass_int:-1, pass_2pt:2, rush_yd:0.1, rush_td:6, rush_2pt:2, rec_yd:0.1, rec_td:6,
  rec_2pt:2, fum_lost:-2, fgm:3, fgm_50p:2, xpm:1, fgmiss:-1, xpmiss:-1, sack:1, int:2, fum_rec:2, def_td:6, safe:2, blk_kick:2};
const seeded = seed => () => { seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };

async function buildDemoLeagues(n){
  /* the pool: everyone with a projection this week, best first, by position */
  const ids=Object.keys(S.proj).filter(id=>(S.proj[id].ppr||0)>0.5);
  await loadPlayers(ids);
  const pool={QB:[],RB:[],WR:[],TE:[],K:[],DEF:[]};
  for(const id of ids){ const p=S.players[id]; if(p && pool[p.pos] && p.team) pool[p.pos].push(id); }
  const cap={QB:36,RB:84,WR:110,TE:36,K:30,DEF:32};
  for(const k in pool) pool[k]=pool[k].sort((a,b)=>(S.proj[b].ppr||0)-(S.proj[a].ppr||0)).slice(0,cap[k]);

  /* the demo user's core: good players spread across kickoff windows, so some of their points are
     banked, some are on the field and some are still to come, like a real Sunday */
  const kick=id=>S.byTeam[S.players[id]?.team]?.start?.getTime() ?? Infinity;
  const spread=(ids,k)=>{ const byTime=[...ids].sort((a,b)=>kick(a)-kick(b)); return [...Array(k)].map((_,j)=>byTime[Math.floor((j+0.5)*byTime.length/k)]); };
  /* a player scores the same in every league, so a core that all has an off day sinks every league at
     once; for the showcase the core is players having at least a normal day */
  const onPace=id=>demoHash(id+"x")>=0.3;
  const favorites=[["QB",12,2],["RB",30,5],["WR",36,6],["TE",12,2]].flatMap(([pos,top,k])=>spread(pool[pos].slice(0,top).filter(onPace),k));

  const configs=DEMO_LEAGUES.slice(0,n), keys=leagueKeys(configs.map(c=>c.name));
  const played=Math.max(0,(S.curWeek||1)-1);
  S.userId="demo";
  S.leagues=configs.map((cfg,i)=>{
    const rng=seeded(1000+i*97), T=cfg.teams, taken=new Set();
    const pick=(t,elig)=>{
      const cands=elig.flatMap(pos=>pool[pos].filter(id=>!taken.has(id))).sort((a,b)=>(S.proj[b].ppr||0)-(S.proj[a].ppr||0));
      /* the demo user reaches for a favorite only when it's close to the best on the board, so their
         teams overlap across leagues without being weaker than everyone else's */
      if(t===0 && cands.length){
        const floor=(S.proj[cands[0]].ppr||0)*0.85;
        const fav=favorites.find(id=>!taken.has(id) && elig.includes(S.players[id].pos) && (S.proj[id].ppr||0)>=floor);
        if(fav){ taken.add(fav); return fav; }
      }
      const id=cands[Math.min(cands.length-1, Math.floor(rng()*rng()*7))];
      if(id) taken.add(id); return id||"0";
    };
    const teams=[...Array(T)].map(()=>({starters:[],bench:[]}));
    const order=[...Array(T).keys()];
    cfg.slots.forEach((slot,si)=>{ for(const t of (si%2?[...order].reverse():order)) teams[t].starters[si]=pick(t, ELIG[slot]||[slot]); });
    [["RB"],["WR"],["RB","WR"],["QB"],["TE"],["RB","WR","TE"]].forEach((elig,ri)=>{
      for(const t of (ri%2?order:[...order].reverse())) teams[t].bench.push(pick(t,elig));
    });

    const names=[...DEMO_TEAMS].sort(()=>rng()-0.5);
    const users=teams.map((_,t)=> t===0
      ? {user_id:"demo", display_name:"demo_player", metadata:{team_name:cfg.me}}
      : {user_id:`u${i}_${t}`, display_name:names[t].toLowerCase().replace(/[^a-z]/g,"")+Math.floor(rng()*90+10), metadata:{team_name:names[t]}});
    const rosters=teams.map((tm,t)=>{
      const wins=[...Array(played)].filter(()=>rng()<0.5).length;
      const fpts=Math.round([...Array(played)].reduce(a=>a+85+rng()*65,0)*100)/100;
      return {roster_id:t+1, owner_id:users[t].user_id, starters:tm.starters, players:[...tm.starters,...tm.bench],
              settings:{wins, losses:played-wins, fpts:Math.floor(fpts), fpts_decimal:Math.round((fpts%1)*100)}};
    });
    const seatOrder=[0,...order.slice(1).sort(()=>rng()-0.5)];
    const matchups=rosters.map(r=>({roster_id:r.roster_id, matchup_id:Math.floor(seatOrder.indexOf(r.roster_id-1)/2)+1,
      points:0, starters:r.starters, players:r.players, players_points:{}}));

    const L={id:`demo-${i+1}`, name:cfg.name, key:keys[i], ci:i%8, avatar:null, rec:cfg.rec,
             scoring:{...DEMO_SCORING, rec:cfg.rec}, slots:cfg.slots};
    hydrateLeague(L, rosters, users, matchups);
    return L;
  });
  S.allLeagues=S.leagues.map(L=>({id:L.id, name:L.name}));
}

let again=false;
async function refresh(first){
  if(!S.cfg.username){ render(); return; }
  if(busy){ if(first) again=true; return; }        // a new username waits for the load in flight
  busy=true; $("#btn").disabled=true; $("#btn").classList.add("spin");
  try{
    await loadState();
    if(S.demoN){
      S.week=S.curWeek;
      await Promise.all([loadGames(), loadProjections()]);
      if(!S.leagues.length) await buildDemoLeagues(S.demoN);
    }else{
      if(first||!S.leagues.length) await loadShell();
      await Promise.all([loadGames(), loadProjections()]);
      const raw=await Promise.all(S.leagues.map(L=>getJSON(`${SLEEPER}/v1/league/${L.id}/rosters`)));
      const need=new Set(); raw.flat().forEach(r=>(r.players||[]).forEach(p=>need.add(p)));
      await loadPlayers([...need]);
      await Promise.all(S.leagues.map(loadLeague));
    }
    simulateLive();
    const firstLook = S.demo && !Object.keys(S.prevPts).length;
    snapshotPts();
    /* a demo's first frame gets a few fresh scoring plays, so the +points tags are on show */
    if(firstLook) liveStarters().slice(0,4).forEach((x,i)=>{ if(x.p.pts) S.deltas[x.p.pid]=[6,2.4,4.1,0.8][i]; });
    S.updated=new Date(); S.err=null; render();
  }catch(e){
    S.err=e.message+"."; console.error(e); render();
  }finally{
    busy=false; $("#btn").disabled=false; $("#btn").classList.remove("spin");
    if(again){ again=false; refresh(true); }
  }
}
function restartTimer(){
  clearInterval(timer);
  timer=setInterval(()=>{ if(!document.hidden && isCurrent() && !S.modal) refresh(false); }, S.cfg.refresh*1000);
}
function setWeek(w){
  S.week=clamp(w,1,S.curWeek||w);
  S.open=new Set(); S.statCache={}; S.prevPts={}; S.deltas={};
  refresh(false);
}

$("#btn").onclick=()=>refresh(false);
$("#gear").onclick=()=>{ S.modal="settings"; render(); };
$("#prev").onclick=()=>{ track("week_changed",{direction:"previous"}); setWeek(S.week-1); };
$("#next").onclick=()=>{ track("week_changed",{direction:"next"}); setWeek(S.week+1); };
$("#now").onclick=()=>{ track("week_changed",{direction:"this_week"}); setWeek(S.curWeek); };
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(S.modal) closeModal();
  else if(S.open.size){ S.open=new Set(); render(); }
});
window.matchMedia("(min-width:900px)").addEventListener("change",e=>{ S.wide=e.matches; render(); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && isCurrent()) refresh(false); });

loadCfg();
/* /scoreboard?user=name opens those leagues (the homepage form and the copyable link use it),
   then the address goes back to plain /scoreboard and the saved username takes over */
const fromLink=(new URLSearchParams(location.search).get("user")||"").trim();
if(fromLink){ const u=new URL(location.href); u.searchParams.delete("user"); history.replaceState(null,"",u.pathname+u.search+u.hash); }
if(S.demo){
  $("#demobar").hidden=false;
  if(S.demoN){
    S.cfg.username="demo";                       // in memory only; a demo never saves
    $("#demobar span").innerHTML=`<b>DEMO</b> · ${S.demoN} sample league${S.demoN>1?"s":""}, simulated live scores`;
  }
}
if(fromLink && !S.demoN && fromLink.toLowerCase()!==S.cfg.username.toLowerCase()) startWith(fromLink, "link");
else refresh(true);
restartTimer();
</script>
