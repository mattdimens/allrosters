<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f2f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AllRosters">
<!-- the app is personal and rendered in the browser, so it stays out of search; the homepage is what ranks -->
<meta name="robots" content="noindex, follow">
<title>Scoreboard · AllRosters</title>
<meta name="description" content="Your live Sleeper fantasy football scoreboard: every league, win probability, and bench points on one screen.">
<link rel="canonical" href="https://allrosters.com/scoreboard">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.sleeper.app" crossorigin>
<link rel="stylesheet" href="/ds/modernist/styles.css">
<link rel="stylesheet" href="/assets/dark.css">
<style>
/* ============================================================
   App layer. Every value below comes from a Modernist token in
   ds/modernist/styles.css — no hard-coded hexes, no radii.
   The dark values live in /assets/dark.css.
   ============================================================ */
html,body{margin:0;padding:0;height:100%}
body{background:var(--color-bg);-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button{font-family:inherit;color:inherit;font-size:inherit;background:none;border:0;padding:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes fan{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}

/* the app is the whole viewport; ≥900px it holds both panes, home pinned open as a sidebar */
.app{width:100%;height:100vh;height:100dvh;background:var(--color-bg);display:flex;flex-direction:column;
  overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view.wide{flex-direction:row}
.pane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.view.wide .pane.home{width:min(38%,380px);flex:none;border-right:2px solid var(--color-divider)}
.scroll{overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.lb{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700)}
.lb.acc{color:var(--color-accent-700)}
.n{font-variant-numeric:tabular-nums;font-weight:800}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:var(--space-2);padding:11px 14px;flex:none;
  border-bottom:2px solid var(--color-divider)}
.brand{font-size:13px;font-weight:800;letter-spacing:.14em;white-space:nowrap}
.wk{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
.step{width:20px;height:22px;display:grid;place-items:center;cursor:pointer;
  color:var(--color-neutral-700);font-size:16px;line-height:1}
.step:hover:not(:disabled){color:var(--color-accent)}
.step:disabled{opacity:.3;cursor:default}
.stamp{white-space:nowrap}
@media(max-width:379px){.stamp{display:none}}
.icon{width:22px;height:22px;display:grid;place-items:center;cursor:pointer;color:var(--color-neutral-700);flex:none}
.icon:hover:not(:disabled){color:var(--color-accent)}
.icon:disabled{opacity:.45;cursor:default}
.icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.icon.spin svg{animation:spin .8s linear infinite}
.blip{width:8px;height:8px;background:var(--color-accent);display:block;flex:none;animation:blip 2s ease-in-out infinite}
.blip.off{background:var(--color-neutral-400);animation:none}

/* ---------- shared bits ---------- */
.err{background:var(--color-accent-100);border-bottom:2px solid var(--color-accent);padding:10px 14px;flex:none}
.err .t{font-size:13px;font-weight:800;color:var(--color-accent-700)}
.err .d{font-size:13px;color:var(--color-neutral-800)}
.loading{padding:40px 14px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr}
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.band{display:flex;align-items:center;gap:var(--space-2);padding:9px 14px;flex:none;
  background:var(--color-surface);border-bottom:2px solid var(--color-divider)}
.note{padding:10px 14px 14px;border-bottom:1px solid var(--color-divider);font-size:13px;color:var(--color-neutral-800)}

/* ---------- home: league cells ---------- */
.lgrid{border-bottom:2px solid var(--color-divider);flex:none}
.cell{padding:12px 12px 13px;text-align:left;cursor:pointer;background:var(--color-bg);width:100%;
  display:flex;flex-direction:column}
.cell:hover,.cell.sel{background:var(--color-accent-100)}
.cells .cell:nth-child(2n){border-left:2px solid var(--color-divider)}
.lgrid .cell:nth-child(n+3){border-top:2px solid var(--color-divider)}
/* under two columns the vertical rules become horizontal ones */
@media(max-width:359px){
  .cells .cell:nth-child(2n),.cells .pcell:nth-child(2n){border-left:0}
  .lgrid .cell+.cell{border-top:2px solid var(--color-divider)}
}
.chead{display:flex;align-items:baseline;gap:6px}
.cme{font-size:30px;line-height:1.05;margin-top:3px}
.cthem{font-size:20px;line-height:1.05;color:var(--color-neutral-600)}
.matrix{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin-top:9px}
.matrix i{aspect-ratio:1;display:block;background:var(--color-neutral-300)}
.matrix i.on{background:var(--color-accent)}
/* auto keeps the OPEN rule on the same line across cells of unequal text */
.copen{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:8px;border-top:1px solid var(--color-divider)}
.copen .o{font-size:11px;font-weight:800;letter-spacing:.08em}
.copen .s{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--color-neutral-700)}

/* ---------- home: live cells ---------- */
.pcell{padding:11px 12px;text-align:left;cursor:pointer;background:var(--color-bg);width:100%;display:block;
  border-bottom:1px solid var(--color-divider)}
.pcell:hover{background:var(--color-accent-100)}
.cells .pcell:nth-child(2n){border-left:1px solid var(--color-divider)}
.pcell .nm{font-size:14px;font-weight:600;margin-top:3px}
.pcell .pt{font-size:26px;line-height:1.1}
.pcell .clock{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--color-accent-700);
  white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.track{height:3px;background:var(--color-neutral-300);margin-top:5px}
.track i{display:block;height:3px;background:var(--color-accent)}

/* ---------- footers ---------- */
.foot{border-top:2px solid var(--color-divider);display:flex;align-items:stretch;flex:none}
.foot .main{flex:1;min-width:0;padding:11px 12px;text-align:left}
.foot .main .v{font-size:15px;font-variant-numeric:tabular-nums;font-weight:800}
button.main{cursor:pointer}
button.main:hover{background:var(--color-accent-100)}
.alertbtn{width:118px;flex:none;border-left:2px solid var(--color-divider);background:var(--color-accent);
  color:var(--color-bg);padding:11px 12px;text-align:left;cursor:pointer}
.alertbtn:hover{background:var(--color-accent-600)}
.alertbtn .k{font-size:10px;font-weight:600;letter-spacing:.12em;opacity:.85}
.alertbtn .v{font-size:15px;font-weight:800;letter-spacing:.02em}
.alertbtn.clear{background:var(--color-surface);color:var(--color-text);cursor:default}
.alertbtn.clear .k{color:var(--color-neutral-700);opacity:1}
.livepill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:var(--color-accent);
  color:var(--color-bg);padding:4px 9px;font-size:10px;font-weight:800;letter-spacing:.12em;white-space:nowrap}
.livepill.off{background:var(--color-surface);color:var(--color-neutral-700)}
.footline{border-top:2px solid var(--color-divider);display:flex;align-items:center;gap:10px;padding:10px 14px;flex:none}

/* ---------- detail ---------- */
.detail{flex:1;display:flex;flex-direction:column;min-height:0}
.detail.enter{animation:slidein .22s ease-out}   /* only when it arrives as a navigation */
.back{display:flex;align-items:center;gap:8px;padding:10px 14px;width:100%;text-align:left;cursor:pointer;flex:none;
  border-bottom:1px solid var(--color-divider)}
.back:hover{background:var(--color-accent-100)}
.back .t{font-size:11px;font-weight:800;letter-spacing:.1em}
.switch{border-bottom:2px solid var(--color-divider);flex:none}
.sw{padding:11px 14px;text-align:left;cursor:pointer;min-height:48px;background:var(--color-bg);
  color:var(--color-neutral-600);display:block;width:100%}
.sw:hover{background:var(--color-accent-100)}
.sw .nm{font-size:11px;font-weight:800;letter-spacing:.1em}
.sw[aria-pressed=true]{background:var(--color-accent);color:var(--color-bg)}
.sw[aria-pressed=true]:hover{background:var(--color-accent-600)}
.sw[aria-pressed=true] .lb{color:var(--color-bg);opacity:.85}
.score{display:flex;flex:none}
.score .body{flex:1;min-width:0;padding:14px 14px 13px}
.big{font-size:clamp(46px,13.5vw,66px);line-height:.86;letter-spacing:-.035em}
.big.them{font-size:clamp(32px,9vw,44px);line-height:.88;letter-spacing:-.03em;color:var(--color-neutral-600)}
.srule{height:2px;background:var(--color-divider);margin:12px 0}
.gauge{width:58px;flex:none;border-left:2px solid var(--color-divider);display:flex;flex-direction:column;
  padding:10px 0;gap:3px;align-items:center}
.gauge .lb{writing-mode:vertical-rl;letter-spacing:.18em;margin-bottom:6px}
.gauge i{width:22px;height:9px;flex:none;display:block;background:var(--color-neutral-300)}
.gauge i.on{background:var(--color-accent)}
.tabs{display:flex;gap:16px;padding:0 14px;flex:none;
  border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider)}
.tabs button{padding:11px 0 9px;cursor:pointer;font-size:12px;letter-spacing:.08em;font-weight:600;
  color:var(--color-neutral-600)}
.tabs button:hover{color:var(--color-accent)}
.tabs button[aria-selected=true]{font-weight:800;color:var(--color-text);
  border-bottom:3px solid var(--color-accent);margin-bottom:-2px}

/* ---------- rows ---------- */
/* wide: rows flow into columns, but anything that organises them spans the lot */
.list.wide{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));align-content:start}
.list.wide .hdr,.list.wide .note,.list.wide .exp,.list.wide .row.on{grid-column:1/-1}
.hdr{display:flex;align-items:baseline;gap:10px;padding:9px 14px;background:var(--color-surface);
  border-bottom:2px solid var(--color-divider)}
.hdr .v{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:12px;letter-spacing:.06em}
.hdr.strong{background:var(--color-accent)}
.hdr.strong .lb,.hdr.strong .v{color:var(--color-bg)}
.list{flex:1;min-height:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:left;min-height:56px;
  background:var(--color-bg);border-bottom:1px solid var(--color-divider)}
button.row{cursor:pointer}
button.row:hover{background:var(--color-accent-100)}
.row.on,.row.flag{background:var(--color-accent-100)}
.row .p{width:56px;flex:none;display:flex;flex-direction:column;align-items:flex-start;font-size:22px;line-height:1}
.row .p.wide{width:68px;font-size:17px;white-space:nowrap}
.row .p.zero{color:var(--color-neutral-500)}
.row .p .dl{font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--color-accent);margin-top:3px}
.row .mid{flex:1;min-width:0}
.row .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .clk{width:78px;flex:none;text-align:left}
.row .clk .lb{white-space:nowrap}
.row .ck{font-size:13px;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.row .ck.live{color:var(--color-accent)}
.row .ck.rec{font-size:15px}

/* ---------- expanded ---------- */
.exp{animation:fan .22s ease-out;background:var(--color-surface);padding:12px 14px 13px;
  border-bottom:2px solid var(--color-divider)}
.exptop{display:flex;align-items:flex-end;gap:14px}
.exptop .big3{font-size:40px;line-height:.9}
.expbar{flex:1;min-width:0;padding-bottom:3px}
.expbar .hd{display:flex;justify-content:space-between;gap:8px}
.bar{height:10px;border:1px solid var(--color-divider);margin-top:5px;display:flex}
.bar .fill{background:var(--color-accent)}
.bar .fill.beat{background:var(--color-text)}
.bar .rest{flex:1;background:repeating-linear-gradient(90deg,var(--color-neutral-400) 0 1px,transparent 1px 4px)}
.stats{margin-top:12px}
.stats .hd{display:flex;align-items:baseline;gap:10px;padding-bottom:5px}
.stats .hd .r{margin-left:auto;width:58px;text-align:right}
.sr{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-top:1px solid var(--color-divider)}
.sr .v{font-size:15px;min-width:42px;font-variant-numeric:tabular-nums;font-weight:800}
.sr .l{font-size:13px;color:var(--color-neutral-800);flex:1;min-width:0}
.sr .p{width:58px;flex:none;text-align:right;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.sr .p.none{color:var(--color-neutral-500)}
.sr .p.neg{color:var(--color-accent-700)}
.total{display:flex;align-items:baseline;gap:10px;padding:7px 0 0;border-top:2px solid var(--color-text)}
.total .k{font-size:11px;font-weight:800;letter-spacing:.1em}
.total .v{margin-left:auto;font-size:20px;width:58px;text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
.expfoot{margin-top:11px;padding-top:9px;border-top:1px solid var(--color-divider);display:flex;gap:12px}
.expfoot > div{flex:1;min-width:0}
.expfoot .v{font-size:13px;font-weight:600;letter-spacing:.02em}

/* ---------- modals ---------- */
.backdrop{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--color-neutral-900) 50%,transparent)}
[data-theme=dark] .backdrop{background:color-mix(in srgb,#000 66%,transparent)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(358px,calc(100% - 32px));
  z-index:41;background:var(--color-surface);border:2px solid var(--color-text);padding:16px;
  max-height:86dvh;overflow:auto;animation:fan .2s ease-out}
.modal h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0}
.mhead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.mhead button{margin-left:auto;cursor:pointer;padding:4px}
.arow{border-top:1px solid var(--color-divider);padding:10px 0}
.arow .t{font-size:15px;font-weight:600}
.field{margin-bottom:14px}
.segbtns{display:flex;border:1px solid var(--color-divider)}
.segbtns button{flex:1;padding:7px 4px;font-size:13px;cursor:pointer;color:var(--color-neutral-700)}
.segbtns button + button{border-left:1px solid var(--color-divider)}
.segbtns button:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
.segbtns button[aria-pressed=true]{background:var(--color-accent);color:var(--color-bg);font-weight:800}
.fielderr{margin-top:6px;min-height:0}
.fielderr:empty{display:none}
.hint{font-size:12px;color:var(--color-neutral-700);margin-top:6px;line-height:1.5}
.linkrow{display:flex;gap:6px}
.linkrow .input{flex:1;min-width:0;font-size:13px}
.obwrap{flex:1;display:flex}
.onboard{margin:auto;width:min(460px,100%);padding:40px 16px}
.onboard h1{font-size:clamp(30px,7vw,40px);line-height:1;letter-spacing:-.03em;margin:10px 0 12px}
.onboard p{color:var(--color-neutral-800);margin:0 0 24px}
.onboard label{display:block;margin-bottom:6px}
.obrow{display:flex;gap:8px;flex-wrap:wrap}
.obrow .input{flex:1 1 200px;min-height:46px;font-size:16px}
.obrow .btn{flex:none;min-height:46px;padding:0 18px;font-size:15px}
@media(max-width:379px){.obrow .btn{flex:1 1 100%}}
.modal .note{padding:12px 0 0;border:0;color:var(--color-neutral-700);line-height:1.6}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <span class="brand">SCOREBOARD</span>
    <div class="wk">
      <button class="step" id="prev" aria-label="Previous week">‹</button>
      <span class="lb" id="wklab">W—</span>
      <button class="step" id="next" aria-label="Next week">›</button>
    </div>
    <span class="lb stamp" id="stamp"></span>
    <button class="icon" id="btn" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
    <button class="icon" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <span class="blip off" id="blip"></span>
  </header>
  <div id="err"></div>
  <div class="view" id="view"><div class="loading lb">Loading rosters and live scores</div></div>
</div>
<div id="layer"></div>

<script>
"use strict";
/* ============================================================
   A single-page Sleeper scoreboard for people in more than one
   league, dressed in the Modernist design system.

   Data: api.sleeper.app (rosters, matchups, players, projections, stats)
         sleeper.com/graphql (live NFL game clocks)
   No server, no keys. Everything below is plain browser JS.
   ============================================================ */

const DEFAULTS = { username:"", refresh:45, theme:"light" };   // no username until the visitor gives one
const SPORT   = "nfl";
const SLEEPER = "https://api.sleeper.app";
const GQL     = "https://sleeper.com/graphql";
const CELLS   = 20;                       // win-probability matrix cells

/* ---------- state ---------- */
const S = {
  cfg:{...DEFAULTS},
  week:null, curWeek:null, season:null, userId:null,
  leagues:[], players:{}, proj:{}, lastProj:0, projWeek:null,
  games:[], byTeam:{}, own:{},
  view:"home", league:null, tab:"mine", open:new Set(), modal:null,
  onboard:{value:"", err:null, busy:false},
  wide: window.matchMedia("(min-width:900px)").matches,
  prevPts:{}, deltas:{}, statCache:{}, err:null, booted:false,
};

/* ---------- helpers ---------- */
const $  = s => document.querySelector(s);
const el = (t,c,x) => { const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; };
const lb = (x,c) => el("div","lb"+(c?" "+c:""),x);   // a label is its own line, even inside a flex row
const f1 = n => (Math.round((n||0)*10)/10).toFixed(1);
const f2 = n => (Math.round((n||0)*100)/100).toFixed(2);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
async function getJSON(url){
  const r = await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error(url.replace(/^https?:\/\/[^/]+/,"")+" returned "+r.status);
  return r.json();
}
function erf(x){ const s=x<0?-1:1; x=Math.abs(x); const t=1/(1+0.3275911*x);
  return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x)); }
const normCdf = z => 0.5*(1+erf(z/Math.SQRT2));
const isCurrent = () => S.week === S.curWeek;
const timeStr = d => d.toLocaleTimeString([], {weekday:"short",hour:"numeric",minute:"2-digit"});
const hhmm    = d => d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
const slotLabel = s => String(s||"").replace(/_/g," ");

/* ---------- config ---------- */
function loadCfg(){
  const c = store.get("sb_cfg") || {};
  S.cfg = {...DEFAULTS, ...c};

/* ============================================================
   GAME CLOCK
   ============================================================ */
function fractionLeft(g){
  if(!g) return 0;
  if(g.state==="pre")  return 1;
  if(g.state==="post") return 0;
  if(g.period>4) return 0.03;
  const [m,s] = String(g.clock||"0:00").split(":").map(Number);
  const left = (isFinite(m)?m:0) + (isFinite(s)?s:0)/60 + (4-g.period)*15;
  return clamp(left/60, 0.02, 1);
}

async function loadLeague(L){

  ]);
  L.userById = {}; for(const u of users) L.userById[u.user_id] = u;
  L.rosters  = rosters; L.matchups = matchups; L.error = null;
  L.teamName = r => { const u=r&&L.userById[r.owner_id]; return u?.metadata?.team_name || u?.display_name || "Team"; };
  L.userName = r => L.userById[r?.owner_id]?.display_name || "";

  const mine = rosters.find(r=>r.owner_id===S.userId || (r.co_owners||[]).includes(S.userId));
  if(!mine){ L.error="You're not on a roster in this league"; L.mine=[]; L.them=[]; return; }
  L.myRoster = mine;
  const mm  = matchups.find(m=>m.roster_id===mine.roster_id);
  const opp = mm ? matchups.find(m=>m.matchup_id===mm.matchup_id && m.roster_id!==mine.roster_id) : null;
  const oppR = opp ? rosters.find(r=>r.roster_id===opp.roster_id) : null;
  L.oppRoster = oppR;
  L.myName=L.teamName(mine); L.oppName=oppR?L.teamName(oppR):null;
  L.myPts=mm?.points??0; L.oppPts=opp?.points??0; L.hasMatchup=!!mm;
  L.mine = buildSide(mm,mine,L); L.them = opp?buildSide(opp,oppR,L):[];
  L.record = `${mine.settings?.wins??0}-${mine.settings?.losses??0}${mine.settings?.ties?`-${mine.settings.ties}`:""}`;
}

function buildSide(m, roster, L){
  const startIds = m?.starters || roster?.starters || [];
  const allIds   = m?.players  || roster?.players  || [];
  const ptsMap   = m?.players_points || {};
  const out=[], seen=new Set();
  startIds.forEach((pid,i)=>{ if(!pid || pid==="0") out.push({pid:`empty-${i}`, name:"Empty "+(slotLabel(L.slots[i])||"")+" slot",
    pos:L.slots[i]||"", team:"", starter:true, empty:true, pts:0, league:L, slot:L.slots[i], slotIndex:i}); });
  for(const pid of allIds){
    if(!pid||seen.has(pid)) continue; seen.add(pid);
    const info=S.players[pid]||{n:pid,pos:"",team:"",inj:""};
    const i=startIds.indexOf(pid);
    out.push({pid, name:info.n, pos:info.pos, team:info.team, inj:info.inj, starter:i>=0,
      slot:i>=0?L.slots[i]:"", slotIndex:i>=0?i:-1, pts:ptsMap[pid]??0, league:L});
  }
  return out;
}

/* ============================================================
   MODELS: win probability, lineup alerts, best lineup
   ============================================================ */
function projectSide(players, L){
  let rem=0, v=0, left=0, total=0;
  for(const p of players){
    if(!p.starter) continue; total++;
    if(p.empty) continue;
    const fr = fractionLeft(S.byTeam[p.team]);
    if(fr<=0) continue;
    if(isOut(p)) continue;
    left++;
    const pj=projFor(p,L); rem+=pj*fr; const sd=Math.max(3,pj*0.55)*Math.sqrt(fr); v+=sd*sd;
  }
  return {rem, sd:Math.sqrt(v), left, total};
}
function winProb(L){
  if(!L.hasMatchup||!L.them.length) return null;
  const a=projectSide(L.mine,L), b=projectSide(L.them,L);
  const diff=(L.myPts+a.rem)-(L.oppPts+b.rem), sd=Math.sqrt(a.sd*a.sd+b.sd*b.sd);
  const p = sd<0.5 ? (diff>0?1:diff<0?0:0.5) : normCdf(diff/sd);
  return { p:clamp(p,0.001,0.999), projMe:L.myPts+a.rem, projOpp:L.oppPts+b.rem,
           left:a.left, total:a.total, oppLeft:b.left, decided:a.left===0&&b.left===0, margin:L.myPts-L.oppPts };
}
const OUT = new Set(["Out","IR","PUP","Sus","COV","NA","Doubtful"]);
const isOut = p => OUT.has(p.inj);

const ELIG = {QB:["QB"],RB:["RB"],WR:["WR"],TE:["TE"],K:["K"],DEF:["DEF"],
  FLEX:["RB","WR","TE"],SUPER_FLEX:["QB","RB","WR","TE"],REC_FLEX:["WR","TE"],WRRB_FLEX:["RB","WR"],
  DL:["DL"],LB:["LB"],DB:["DB"],IDP_FLEX:["DL","LB","DB"]};

/* the highest-scoring legal lineup out of everyone rostered, and who filled each slot */
function bestLineup(players, slots){
  const order = slots.map((s,i)=>({s,i})).filter(x=>ELIG[x.s])
                     .sort((a,b)=>ELIG[a.s].length-ELIG[b.s].length);   // tightest slots first
  const pool = players.filter(p=>!p.empty).sort((a,b)=>b.pts-a.pts);
  const taken=new Set(); let total=0; const picks=[];
  for(const {s,i} of order){
    const pick = pool.find(p=>!taken.has(p.pid) && ELIG[s].includes(p.pos));
    if(pick){ taken.add(pick.pid); total+=pick.pts; picks.push({slot:s, slotIndex:i, p:pick}); }
  }
  return {total, picks};
}
function benchStory(L){
  const {total,picks} = bestLineup(L.mine||[], L.slots||[]);
  const gain = total - (L.myPts||0);
  const swaps = [];
  for(const pk of picks){
    if(pk.p.starter) continue;
    const cur = (L.mine||[]).find(p=>p.starter && p.slotIndex===pk.slotIndex);
    const who = !cur || cur.empty ? `the empty ${slotLabel(pk.slot)} slot` : cur.name;
    swaps.push(`${pk.p.name} at ${slotLabel(pk.slot)} instead of ${who}`);
  }
  return {gain:Math.max(0,gain), swaps};
}
function benchPts(L){ return (L.mine||[]).filter(p=>!p.starter&&!p.empty).reduce((a,p)=>a+(p.pts||0),0); }

/* who could still be swapped in for a slot, best projection first */
function benchFor(L, slot){
  const ok = ELIG[slot] || [];
  return (L.mine||[]).filter(p=>!p.starter && !p.empty && ok.includes(p.pos) && !isOut(p)
      && fractionLeft(S.byTeam[p.team])>0)
    .sort((a,b)=>projFor(b,L)-projFor(a,L));
}
function lineupAlerts(L){
  const out=[];
  for(const p of L.mine||[]){
    if(!p.starter) continue;
    const g=S.byTeam[p.team];
    if(g && g.state==="post") continue;               // too late to matter
    const opts = benchFor(L, p.slot).slice(0,2).map(x=>x.name);
    const bench = opts.length ? `bench has ${opts.join(" and ")}` : "nobody free on your bench";
    if(p.empty) out.push({league:L, text:`Empty ${slotLabel(p.slot)||""} slot`.replace("  "," "),
      sub:`Nobody assigned · ${bench}`});
    else if(!g && p.team) out.push({league:L, text:`${p.name} is on bye`, sub:`${p.pos} · no game this week · ${bench}`});
    else if(isOut(p)) out.push({league:L, text:`${p.name} is ${p.inj}`,
      sub:`${[p.pos,p.team].filter(Boolean).join(" ")} · ${gameLabel(p.team).txt} · ${bench}`});
  }
  return out;
}
const allAlerts = () => S.leagues.flatMap(lineupAlerts);

/* every league a player shows up in, on either side of my matchup */
function ownership(){
  const m={};
  for(const L of S.leagues){
    for(const p of L.mine||[]) if(!p.empty) (m[p.pid]=m[p.pid]||[]).push({L,mine:true,starter:p.starter,pts:p.pts});
    for(const p of L.them||[]) if(!p.empty) (m[p.pid]=m[p.pid]||[]).push({L,mine:false,starter:p.starter,pts:p.pts});
  }
  return m;
}
/* the compact "· D" / "· VS D" tag that says a player is in play twice */
function sharedTag(pid, L){
  const e=(S.own[pid]||[]).filter(x=>x.L!==L);
  if(!e.length) return "";
  const vs = e.filter(x=>!x.mine && x.starter).map(x=>x.L.key);
  if(vs.length) return " · VS "+vs.join("+");
  const mine = e.filter(x=>x.mine).map(x=>x.L.key);
  return mine.length ? " · "+mine.join("+") : "";
}
function rosteredText(pid, fallback){
  const e=S.own[pid]||[];
  if(!e.length) return fallback||"";
  return e.map(x=> x.mine ? `${x.L.name} ${x.starter?"starting":"bench"}` : `against you in ${x.L.name}`).join(" · ");
}

/* ============================================================
   STAT LINES
   ============================================================ */
const STAT_ORDER = {
  QB:["pass_cmp","pass_att","pass_yd","pass_td","pass_int","pass_2pt","rush_att","rush_yd","rush_td","fum_lost"],
  RB:["rush_att","rush_yd","rush_td","rec_tgt","rec","rec_yd","rec_td","fum_lost"],
  WR:["rec_tgt","rec","rec_yd","rec_td","rush_att","rush_yd","rush_td","fum_lost"],
  TE:["rec_tgt","rec","rec_yd","rec_td","fum_lost"],
  K :["fgm","fga","fgm_50p","xpm","fgmiss","xpmiss"],
  DEF:["sack","int","fum_rec","def_td","safe","blk_kick","pts_allow","yds_allow"],
};
const STAT_LABEL = {
  pass_cmp:"completions", pass_att:"pass attempts", pass_yd:"passing yards", pass_td:"passing TD",
  pass_int:"interceptions thrown", pass_2pt:"2-point pass", rush_att:"carries", rush_yd:"rushing yards",
  rush_td:"rushing TD", rush_2pt:"2-point rush", rec:"receptions", rec_tgt:"targets", rec_yd:"receiving yards",
  rec_td:"receiving TD", rec_2pt:"2-point catch", fum_lost:"fumbles lost", fum:"fumbles",
  fgm:"field goals", fga:"attempts", fgm_50p:"from 50+", xpm:"extra points", fgmiss:"missed FG",
  xpmiss:"missed XP", sack:"sacks", int:"interceptions", fum_rec:"fumble recoveries", def_td:"defensive TD",
  safe:"safeties", blk_kick:"blocked kicks", pts_allow:"points allowed", yds_allow:"yards allowed",
};
const prettyStat = k => STAT_LABEL[k] || k.replace(/_/g," ");
const fmtStat = v => Number.isInteger(v) ? String(v) : String(Math.round(v*10)/10);

/* one line per stat, priced with this league's own scoring settings */
function breakdown(p, L, st){
  if(!st) return [];
  const sc=(L&&L.scoring)||{}, out=[], used=new Set();
  /* a stat the league doesn't price (carries, targets) is context, not points */
  const push=k=>{ const v=st[k]; if(v==null||v===0||used.has(k)) return; used.add(k);
    out.push({v:fmtStat(v), label:prettyStat(k), pts: sc[k] ? sc[k]*v : null}); };
  for(const k of (STAT_ORDER[p.pos]||[])) push(k);
  const extra = Object.keys(st).filter(k=>!used.has(k) && sc[k]!=null && st[k] && Math.abs(sc[k]*st[k])>=0.05 && !/^pts_/.test(k));
  extra.sort((a,b)=>Math.abs(sc[b]*st[b])-Math.abs(sc[a]*st[a]));
  for(const k of extra.slice(0,6)) out.push({v:fmtStat(st[k]), label:prettyStat(k), pts:sc[k]*st[k]});
  if(st.off_snp && st.tm_off_snp) out.push({v:Math.round(100*st.off_snp/st.tm_off_snp)+"%", label:"of snaps", pts:null});
  return out;
}
const statKey = pid => `${pid}:${S.week}`;
async function statsFor(pid){
  const k=statKey(pid);
  if(S.statCache[k]!==undefined) return S.statCache[k];
  try{
    const d = await getJSON(`${SLEEPER}/stats/${SPORT}/player/${pid}?season_type=regular&season=${S.season}&grouping=week`);
    return S.statCache[k] = (d?.[String(S.week)]?.stats || null);

/* ============================================================
   RENDER — shared pieces
   ============================================================ */
function gameLabel(team){
  const g=S.byTeam[team];
  if(!g) return {txt:team?"On bye":"No game", clock:"—", sub:"NO GAME", live:false, phase:"none", frac:0};
  const line = g.state==="post" ? `Final · ${g.away} ${g.awayScore} ${g.home} ${g.homeScore}`
    : g.state==="in" ? `${g.period>4?"OT":"Q"+g.period} ${g.clock} · ${g.away} ${g.awayScore} ${g.home} ${g.homeScore}`
    : `Kicks ${hhmm(g.start)} · ${g.away} at ${g.home}`;
  const other = team===g.home ? g.away : g.home;
  const mineScore = team===g.home ? g.homeScore : g.awayScore;
  const theirScore = team===g.home ? g.awayScore : g.homeScore;
  return {
    txt: line,
    clock: g.state==="post" ? "FINAL" : g.state==="in" ? `${g.period>4?"OT":"Q"+g.period} ${g.clock}` : hhmm(g.start),
    sub: g.state==="pre" ? `${g.away} AT ${g.home}` : `${mineScore} · ${theirScore} ${other}`,
    live: g.state==="in", phase:g.state, frac:1-fractionLeft(g), game:g
  };
}
function paceOf(p, proj){
  const gl=gameLabel(p.team);
  if(!proj) return "NO PROJECTION";
  if(gl.phase==="none") return "NO GAME";
  if(gl.phase==="pre")  return "NOT STARTED";
  if(gl.phase==="post") return p.pts>=proj ? "BEAT PROJECTION" : "MISSED IT";
  return p.pts >= proj*gl.frac ? "AHEAD OF PACE" : "BEHIND PACE";
}

/* the drawer under a player row: score against projection, then the box score priced out */
function playerPanel(p, L, ctx){
  const w=el("div","exp");
  const proj=projFor(p,L);
  const top=el("div","exptop");
  const a=el("div"); a.appendChild(lb("SCORED")); a.appendChild(el("div","big3 n",f1(p.pts))); top.appendChild(a);
  const bar=el("div","expbar");
  const hd=el("div","hd"); hd.appendChild(lb("VS PROJECTION "+f1(proj))); hd.appendChild(lb(paceOf(p,proj)));
  bar.appendChild(hd);
  const track=el("div","bar");
  const fill=el("div","fill"+(proj&&p.pts>=proj?" beat":""));
  fill.style.width=clamp(proj?(p.pts/proj)*100:0,0,100).toFixed(0)+"%";
  track.appendChild(fill); track.appendChild(el("div","rest")); bar.appendChild(track);
  top.appendChild(bar); w.appendChild(top);

  const st=S.statCache[statKey(p.pid)];
  const lines=breakdown(p,L,st);
  const box=el("div","stats");
  const bh=el("div","hd");
  bh.appendChild(lb(st===undefined ? "LOADING BOX SCORE" : lines.length ? "POINT BREAKDOWN" : "NO BOX SCORE YET"));
  if(lines.length){ const r=lb("PTS","r"); r.classList.add("r"); bh.appendChild(r); }
  box.appendChild(bh);
  for(const s of lines){
    const r=el("div","sr");
    r.appendChild(el("span","v",s.v));
    r.appendChild(el("span","l",s.label));
    r.appendChild(el("span","p"+(s.pts==null?" none":s.pts<0?" neg":""), s.pts==null?"—":f1(s.pts)));
    box.appendChild(r);
  }
  if(lines.length){
    const t=el("div","total"); t.appendChild(el("span","k","TOTAL SCORED"));

function leagueCell(L){
  const b=el("button","cell"+(S.wide && L.id===detailLeague().id ? " sel":""));
  b.onclick=()=>openLeague(L.id);
  const h=el("div","chead");
  h.appendChild(lb(L.name.toUpperCase(),"acc"));
  const rec=lb(L.record||""); rec.style.marginLeft="auto"; h.appendChild(rec);
  b.appendChild(h);

  if(L.error){ b.appendChild(el("div","cme n","—")); b.appendChild(el("div","lb",L.error)); return b; }
  if(!L.hasMatchup){ b.appendChild(el("div","cme n","—")); b.appendChild(lb(`NO WEEK ${S.week} MATCHUP`)); return b; }

  b.appendChild(el("div","cme n",f2(L.myPts)));
  b.appendChild(el("div","cthem n",f2(L.oppPts)));

  const w=winProb(L);
  const on=w?Math.round(w.p*CELLS):0;
  const m=el("div","matrix");
  for(let i=0;i<CELLS;i++) m.appendChild(el("i",i<on?"on":null));
  b.appendChild(m);
  b.appendChild(lb(!w ? "NO MATCHUP"
    : w.decided ? `FINAL · ${w.margin>=0?"WON":"LOST"} BY ${f1(Math.abs(w.margin))}`
    : `${Math.round(w.p*100)}% TO WIN · ${on} OF ${CELLS}`));

  const bs=benchStory(L);
  const bp=lb(`BENCH ${f1(benchPts(L))} · +${f1(bs.gain)} LOST`); bp.classList.add("acc");
  bp.style.marginTop="3px"; b.appendChild(bp);

  const o=el("div","copen");
  o.appendChild(el("span","o","OPEN"));
  const ahead=L.myPts>=L.oppPts;
  o.appendChild(el("span","s n",(ahead?"UP ":"DOWN ")+f1(Math.abs(L.myPts-L.oppPts))));
  b.appendChild(o);
  return b;
}

function liveStarters(){
  const out=[], seen=new Set();
  for(const L of S.leagues) for(const p of L.mine||[]){
    if(!p.starter||p.empty||seen.has(p.pid)) continue;
    const gl=gameLabel(p.team);
    if(!gl.live) continue;
    seen.add(p.pid); out.push({p,L,gl});
  }
  return out.sort((a,b)=>b.p.pts-a.p.pts);
}
function liveCell({p,L,gl}){
  const b=el("button","pcell");
  b.onclick=()=>openLeague(L.id,p.pid);
  const h=el("div","chead");
  h.appendChild(lb([p.pos,p.team].filter(Boolean).join(" ")+" · "+L.key+sharedTag(p.pid,L)));
  h.appendChild(el("span","clock",gl.clock));
  b.appendChild(h);
  b.appendChild(el("div","nm ell",p.name));
  b.appendChild(el("div","pt n",f1(p.pts)));
  const t=el("div","track"); const i=el("i"); i.style.width=Math.round(gl.frac*100)+"%"; t.appendChild(i);
  b.appendChild(t);
  return b;
}

function renderHome(v){
  const body=el("div","scroll");
  body.style.flex="1";
  const g=el("div","cells lgrid");
  for(const L of S.leagues) g.appendChild(leagueCell(L));
  body.appendChild(g);

  const live=liveStarters();
  const band=el("div","band"); band.appendChild(lb("ON THE FIELD NOW"));
  const c=lb(live.length+" PLAYING"); c.style.marginLeft="auto"; band.appendChild(c);
  body.appendChild(band);

  foot.appendChild(ab);
  v.appendChild(foot);
}

function detailLeague(){ return S.leagues.find(l=>l.id===S.league) || S.leagues[0]; }
function openLeague(id, expandPid){

function mineRows(L, host){
  const st=(L.mine||[]).filter(p=>p.starter);
  const bn=(L.mine||[]).filter(p=>!p.starter&&!p.empty).sort((a,b)=>b.pts-a.pts);
  host.appendChild(headerRow(`STARTING ${st.length}`, `SCORED ${f2(L.myPts)}`));
  st.forEach(p=>pushPlayer(host,p,L,`${L.id}:${p.pid}`));
  if(bn.length){
    host.appendChild(headerRow(`BENCH ${bn.length}`, `${f1(benchPts(L))} PTS SAT OUT`));
    bn.forEach(p=>pushPlayer(host,p,L,`${L.id}:${p.pid}`));
  }
  const bs=benchStory(L);
  host.appendChild(headerRow("LEFT ON THE BENCH", "+"+f1(bs.gain), true));
  const w=winProb(L);
  host.appendChild(el("div","note", bs.swaps.length
    ? bs.swaps.slice(0,2).join(", ") + "."
    : w && w.decided ? "You played your best possible lineup."
    : "You're playing your best possible lineup so far."));
}
function pushPlayer(host,p,L,key){
  const gl=gameLabel(p.team);
  const proj=projFor(p,L);
  const open=S.open.has(key);
  const shared=sharedTag(p.pid,L);
  const flag=p.empty||isOut(p)||!!shared;
  const meta=[[p.pos,p.team].filter(Boolean).join(" "), p.inj||"", shared.replace(/^ · /,"")]
    .filter(Boolean).join(" · ");
  host.appendChild(rowEl({
    pts:f1(p.pts), zero:!p.pts, delta:S.deltas[p.pid], name:p.name, meta, metaAccent:flag,
    clock:gl.clock, clockSub:gl.sub, live:gl.live, on:open, flag,
    onClick:()=>toggle(key,p.empty?null:p.pid)
  }));
  if(open) host.appendChild(playerPanel(p,L,p.empty?"Nobody assigned":""));
}

function clockRows(L, host){
  if(!S.games.length){ host.appendChild(el("div","note","Live game clocks are unreachable right now.")); return; }
  const mine={};
  for(const lg of S.leagues) for(const p of lg.mine||[]){ if(p.empty||!p.team) continue;
    (mine[p.team]=mine[p.team]||[]).push({p,lg}); }
  const order={in:0,pre:1,post:2};
  const count=g=>[...(mine[g.home]||[]),...(mine[g.away]||[])];
  const games=[...S.games].sort((a,b)=>(order[a.state]-order[b.state])
    || (count(b).filter(x=>x.p.starter).length-count(a).filter(x=>x.p.starter).length) || (a.start-b.start));
  for(const g of games){
    const key="clock:"+g.id, open=S.open.has(key);
    const ps=count(g).sort((a,b)=>b.p.pts-a.p.pts);
    const starters=ps.filter(x=>x.p.starter).length;
    host.appendChild(rowEl({
      pts:g.state==="pre"?"—":`${g.awayScore}-${g.homeScore}`, zero:g.state==="pre", wide:true,
      name:`${g.away} AT ${g.home}`,
      meta: g.state==="in" ? `${g.period>4?"OT":"Q"+g.period} ${g.clock}`+(g.dnd?` · ${g.dnd}`:"")+(g.poss?` · ${g.poss} ball`:"")
        : g.state==="post" ? (g.period>4?"Final, overtime · ":"")+timeStr(g.start) : timeStr(g.start),
      metaAccent:g.state==="in",
      clock: g.state==="in"?"LIVE":g.state==="post"?"FINAL":"SOON", live:g.state==="in",
      clockSub: `${starters} OF YOURS`, on:open,
      onClick:()=>toggle(key)
    }));
    if(open){
      const w=el("div","exp");
      const box=el("div","stats"); box.style.marginTop="0";
      const bh=el("div","hd"); bh.appendChild(lb(ps.length?"YOUR PLAYERS IN THIS GAME":"NOBODY OF YOURS IN THIS ONE"));
      if(ps.length){ const r=lb("PTS"); r.classList.add("r"); bh.appendChild(r); }
      box.appendChild(bh);
      for(const {p,lg} of ps){
        const r=el("div","sr");
        r.appendChild(el("span","v",p.starter?lg.key:"—"));
        r.appendChild(el("span","l",`${p.name} · ${[p.pos,p.team].filter(Boolean).join(" ")} · ${lg.name} ${p.starter?"starting":"bench"}`));
        r.appendChild(el("span","p"+(p.pts?"":" none"),f1(p.pts)));
        box.appendChild(r);
      }
      w.appendChild(box);
      const foot=el("div","expfoot");
      const a=el("div"); a.appendChild(lb("STATE")); a.appendChild(el("div","v n",
        g.state==="in"?`${g.period>4?"OT":"Q"+g.period} ${g.clock}`:g.state==="post"?"Final":`Kicks ${hhmm(g.start)}`));
      foot.appendChild(a);
      const b=el("div"); b.appendChild(lb("SCORE")); b.appendChild(el("div","v n",
        g.state==="pre"?"—":`${g.away} ${g.awayScore} · ${g.home} ${g.homeScore}`)); foot.appendChild(b);
      w.appendChild(foot); host.appendChild(w);
    }
  }
}

function themRows(L, host){
  const st=(L.them||[]).filter(p=>p.starter&&!p.empty).sort((a,b)=>b.pts-a.pts);
  if(!st.length){ host.appendChild(el("div","note","No opponent lineup posted yet.")); return; }
  host.appendChild(headerRow(`${(L.oppName||"OPPONENT").toUpperCase()} · ${st.length} STARTING`, `SCORED ${f2(L.oppPts)}`));
  for(const p of st){
    const key=`${L.id}:T:${p.pid}`, open=S.open.has(key), gl=gameLabel(p.team);
    const mineToo=(S.own[p.pid]||[]).some(x=>x.mine);
    const meta=[[p.pos,p.team].filter(Boolean).join(" "), p.inj||"", mineToo?"YOURS ELSEWHERE":""]
      .filter(Boolean).join(" · ");
    host.appendChild(rowEl({
      pts:f1(p.pts), zero:!p.pts, delta:S.deltas[p.pid], name:p.name, meta, metaAccent:mineToo,
      clock:gl.clock, clockSub:gl.sub, live:gl.live, on:open, flag:mineToo,
      onClick:()=>toggle(key,p.pid)
    }));
    if(open) host.appendChild(playerPanel(p,L,`${L.oppName||"Opponent"} starting`));
  }
}

function tableRows(L, host){
  if(!L.rosters){ host.appendChild(el("div","note","Standings unavailable.")); return; }
  const wk=r=>L.matchups.find(x=>x.roster_id===r.roster_id)?.points||0;
  const rows=[...L.rosters].sort((a,b)=>{ const A=a.settings||{},B=b.settings||{};
    return (B.wins-A.wins)||(A.losses-B.losses)
      ||((B.fpts+(B.fpts_decimal||0)/100)-(A.fpts+(A.fpts_decimal||0)/100))||(wk(b)-wk(a)); });
  host.appendChild(headerRow(`${L.name.toUpperCase()} · ${rows.length} TEAMS`, `WEEK ${S.week}`));
  rows.forEach((r,i)=>{
    const st=r.settings||{}, me=r.roster_id===L.myRoster?.roster_id;
    host.appendChild(rowEl({
      pts:String(i+1), name:L.teamName(r),
      meta:`${L.userName(r)} · ${f1(wk(r))} pts`,
      clock:`${st.wins??0}-${st.losses??0}`, clockSub:me?"YOU":"RECORD", bigClock:true, flag:me
    }));
  });
}

  const layer=$("#layer");
  if(!S.modal){ layer.innerHTML=""; return; }

    const al=allAlerts();
    if(!al.length) m.appendChild(el("div","arow","Nothing to fix."));

      const r=el("div","arow");

    f1b.appendChild(un);
    const unErr=el("div","lb acc fielderr"); unErr.setAttribute("role","alert"); f1b.appendChild(unErr);
    m.appendChild(f1b);

    const f2b=el("div","field"); f2b.appendChild(el("label",null,"Refresh every"));
    const seg=el("div","segbtns");
    [[30,"30s"],[45,"45s"],[90,"90s"],[300,"5 min"]].forEach(([v,label])=>{
      const b=el("button",null,label); b.setAttribute("aria-pressed",S.cfg.refresh===v);
      b.onclick=()=>{ S.cfg.refresh=v; seg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); };
      seg.appendChild(b);
    });
    f2b.appendChild(seg); m.appendChild(f2b);

    const f3=el("div","field"); f3.appendChild(el("label",null,"Look"));
    const seg2=el("div","segbtns");
    [["light","Light"],["dark","Dark"]].forEach(([v,label])=>{
      const b=el("button",null,label); b.setAttribute("aria-pressed",S.cfg.theme===v);
      b.onclick=()=>{ S.cfg.theme=v; applyTheme(v); seg2.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); };
      seg2.appendChild(b);
    });
    f3.appendChild(seg2); m.appendChild(f3);

    const save=el("button","btn btn-primary btn-block","Save");
    save.onclick=async()=>{
      const name=un.value.trim();
      restartTimer();
      if(name && name.toLowerCase()!==S.cfg.username.toLowerCase()){
        save.disabled=true; save.textContent="Checking username…"; unErr.textContent="";
        const err=await adoptUser(name);          // saves everything and closes on success
        if(err){ unErr.textContent=err; save.disabled=false; save.textContent="Save"; }
        return;
      }
      saveCfg(); S.modal=null; render();
    };
    m.appendChild(save);

    if(S.cfg.username){
      /* storage can be cleared by the browser, and a home-screen app keeps its own;
         this link restores the leagues anywhere */
      const f4=el("div","field"); f4.style.margin="16px 0 0";
      const l4=el("label",null,"Your scoreboard link"); l4.htmlFor="ulink"; f4.appendChild(l4);
      const row=el("div","linkrow");
      const link=el("input","input"); link.id="ulink"; link.readOnly=true; link.value=userLink();
      link.onfocus=()=>link.select();
      const cp=el("button","btn btn-secondary","Copy");
      cp.onclick=async()=>{
        try{ await navigator.clipboard.writeText(link.value); cp.textContent="Copied"; }
        catch(e){ link.focus(); link.select(); cp.textContent="Press ⌘C"; }
        setTimeout(()=>cp.textContent="Copy",1800);
      };
      row.appendChild(link); row.appendChild(cp); f4.appendChild(row);
      f4.appendChild(el("div","hint","Bookmark it, or open it on another device, to bring your leagues straight back."));
      m.appendChild(f4);
    }

    const rl=el("button","btn btn-secondary btn-block","Reload player database");
    rl.onclick=()=>{ store.set("sb_players",null); S.modal=null; refresh(false); };

      fg.onclick=forgetUser; m.appendChild(fg);
    }
    m.appendChild(el("div","note","Everything here lives in this browser only. Sleeper's API is read-only, so lineups and waivers still happen in the Sleeper app."));
  });
}

function renderOnboard(v){
  const o=S.onboard;
  const wrap=el("div","scroll obwrap");
  const f=el("form","onboard"); f.noValidate=true;
  f.appendChild(lb("WELCOME TO ALLROSTERS","acc"));
  f.appendChild(el("h1",null,"What's your Sleeper username?"));
  f.appendChild(el("p",null,"AllRosters loads every NFL league you're in this season. Your username is saved in this browser, so your leagues are here the next time you open the scoreboard."));
  const l=el("label","lb","Sleeper username"); l.htmlFor="ob"; f.appendChild(l);
  const row=el("div","obrow");
  const inp=el("input","input"); inp.id="ob"; inp.name="user"; inp.value=o.value; inp.required=true;
  inp.autocapitalize="off"; inp.autocomplete="off"; inp.spellcheck=false; inp.enterKeyHint="go";
  inp.oninput=()=>{ o.value=inp.value; };
  inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); if(!o.busy) startWith(inp.value); } };   // don't lean on implicit submit
  row.appendChild(inp);
  const go=el("button","btn btn-primary",o.busy?"Checking…":"Load my leagues"); go.type="submit"; go.disabled=o.busy;
  row.appendChild(go); f.appendChild(row);
  const err=el("div","lb acc fielderr",o.err||""); err.setAttribute("role","alert"); f.appendChild(err);
  f.appendChild(el("div","hint","It's the name on your Sleeper profile. No password, no account: Sleeper's public data is read-only."));
  f.onsubmit=e=>{ e.preventDefault(); startWith(inp.value); };
  wrap.appendChild(f); v.appendChild(wrap);
  if(!o.busy && !matchMedia("(pointer:coarse)").matches) setTimeout(()=>inp.focus(),0);
}
async function startWith(name){
  S.onboard={value:name, err:null, busy:true}; render();
  const err=await adoptUser(name);
  if(err){ S.onboard={value:name, err, busy:false}; render(); }
}

function syncHeader(){
  $("#wklab").textContent = "W"+(S.week??"—");
  $("#stamp").textContent = isCurrent() ? hhmm(new Date()) : "PAST WEEK";
  $("#prev").disabled = !S.curWeek || S.week<=1;
  $("#next").disabled = !S.curWeek || S.week>=S.curWeek;
  const live = isCurrent() && S.games.some(g=>g.state==="in");
  $("#blip").classList.toggle("off", !live);
}
function render(){
  syncHeader();
  const e=$("#err"); e.innerHTML="";
  if(S.err){
    const b=el("div","err"); b.appendChild(el("div","t","COULDN'T LOAD"));
    b.appendChild(el("div","d",S.err)); e.appendChild(b);
  }
  const v=$("#view"); v.innerHTML=""; v.className="view"+(S.wide?" wide":"");
  if(!S.cfg.username){ renderOnboard(v); renderModal(); return; }
  if(!S.leagues.length){
    v.appendChild(el("div","loading lb", S.err ? "Open settings to fix it" : "Loading rosters and live scores"));
    renderModal(); return;
  }
  S.own=ownership();
  const home=()=>{ const p=el("div","pane home"); renderHome(p); return p; };
  const detail=()=>{ const p=el("div","pane detail"+(S.wide?"":" enter")); renderDetail(p); return p; };
  if(S.wide){ v.appendChild(home()); v.appendChild(detail()); }
  else if(S.view==="detail" && S.leagues.some(l=>l.id===S.league)) v.appendChild(detail());
  else { S.view="home"; v.appendChild(home()); }
  renderModal();
}

/* ============================================================
   ORCHESTRATION
   ============================================================ */
let busy=false, timer=null;
function snapshotPts(){
  const cur={};
  for(const L of S.leagues){ cur[`team:${L.id}`]=L.myPts;
    for(const p of [...(L.mine||[]),...(L.them||[])]) cur[p.pid]=Math.max(cur[p.pid]||0,p.pts); }
  S.deltas={};
  if(isCurrent()) for(const k in cur){ if(S.prevPts[k]!=null){ const d=cur[k]-S.prevPts[k]; if(Math.abs(d)>=0.05) S.deltas[k]=d; } }
  S.prevPts=cur;
}
let again=false;
async function refresh(first){
  if(!S.cfg.username){ render(); return; }
  if(busy){ if(first) again=true; return; }        // a new username waits for the load in flight
  busy=true; $("#btn").disabled=true; $("#btn").classList.add("spin");
  try{
    await loadState();
    if(first||!S.leagues.length) await loadShell();
    await Promise.all([loadGames(), loadProjections()]);
    const raw=await Promise.all(S.leagues.map(L=>getJSON(`${SLEEPER}/v1/league/${L.id}/rosters`)));
    const need=new Set(); raw.flat().forEach(r=>(r.players||[]).forEach(p=>need.add(p)));
    await loadPlayers([...need]);
    await Promise.all(S.leagues.map(loadLeague));
    snapshotPts();
    S.err=null; render();
  }catch(e){
    S.err=e.message+"."; console.error(e); render();
  }finally{
    busy=false; $("#btn").disabled=false; $("#btn").classList.remove("spin");
    if(again){ again=false; refresh(true); }
  }
}
function restartTimer(){
  clearInterval(timer);
  timer=setInterval(()=>{ if(!document.hidden && isCurrent() && !S.modal) refresh(false); }, S.cfg.refresh*1000);
}
function setWeek(w){
  S.week=clamp(w,1,S.curWeek||w);
  S.open=new Set(); S.statCache={}; S.prevPts={}; S.deltas={};
  refresh(false);
}

$("#btn").onclick=()=>refresh(false);
$("#gear").onclick=()=>{ S.modal="settings"; render(); };
$("#prev").onclick=()=>setWeek(S.week-1);
$("#next").onclick=()=>setWeek(S.week+1);
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&S.modal) closeModal(); });
window.matchMedia("(min-width:900px)").addEventListener("change",e=>{ S.wide=e.matches; render(); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && isCurrent()) refresh(false); });

loadCfg();
/* /scoreboard?user=name opens those leagues (the homepage form and the copyable link use it),
   then the address goes back to plain /scoreboard and the saved username takes over */
const fromLink=(new URLSearchParams(location.search).get("user")||"").trim();
if(fromLink) history.replaceState(null,"",location.pathname+location.hash);
if(fromLink && fromLink.toLowerCase()!==S.cfg.username.toLowerCase()) startWith(fromLink);
else refresh(true);
restartTimer();
</script>
</body>
