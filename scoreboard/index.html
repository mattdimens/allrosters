<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<script src="/assets/analytics.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f2f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AllRosters">
<!-- the app is personal and rendered in the browser, so it stays out of search; the homepage is what ranks -->
<meta name="robots" content="noindex, follow">
<title>Scoreboard · AllRosters</title>
<meta name="description" content="Your live Sleeper fantasy football scoreboard: every league, win probability, and bench points on one screen.">
<link rel="canonical" href="https://allrosters.com/scoreboard">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.sleeper.app" crossorigin>
<link rel="stylesheet" href="/ds/modernist/styles.css">
<link rel="stylesheet" href="/assets/dark.css">
<link rel="stylesheet" href="/assets/leagues.css">
<style>
/* ============================================================
   App layer. Every value below comes from a Modernist token in
   ds/modernist/styles.css — no hard-coded hexes, no radii.
   The dark values live in /assets/dark.css.
   ============================================================ */
html,body{margin:0;padding:0;height:100%}
body{background:var(--color-bg);-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button{font-family:inherit;color:inherit;font-size:inherit;background:none;border:0;padding:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes fan{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}

/* the app is the whole viewport; ≥900px it holds both panes, home pinned open as a sidebar */
.app{width:100%;height:100vh;height:100dvh;background:var(--color-bg);display:flex;flex-direction:column;
  overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view.wide{flex-direction:row}
.pane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.view.wide .pane.home{width:min(38%,380px);flex:none;border-right:2px solid var(--color-divider)}
.scroll{overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.lb{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700)}
.lb.acc{color:var(--color-accent-700)}
.n{font-variant-numeric:tabular-nums;font-weight:800}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:2px;padding:4px 8px 4px 14px;flex:none;
  border-bottom:2px solid var(--color-divider)}
.brand{display:flex;align-items:center;gap:9px;min-height:40px;min-width:40px;padding-right:4px;font-size:13px;font-weight:800;letter-spacing:.14em;
  white-space:nowrap;color:var(--color-text);text-decoration:none}
.brand:hover .word{color:var(--color-accent)}
.brand svg{width:20px;height:20px;display:block;flex:none}
/* the week control: a labeled stepper, and a way home when you've gone back in time */
.wk{margin-left:auto;display:flex;align-items:stretch;flex:none;height:36px;border:1px solid var(--color-divider)}
.wklab{display:grid;place-items:center;min-width:76px;padding:0 6px;font-size:12px;font-weight:800;letter-spacing:.08em;
  white-space:nowrap;font-variant-numeric:tabular-nums;border-left:1px solid var(--color-divider);border-right:1px solid var(--color-divider)}
.wk.past{border-color:var(--color-accent)}
.wk.past .wklab{color:var(--color-accent-700);border-color:var(--color-accent)}
.nowbtn{flex:none;height:36px;margin-left:6px;padding:0 10px;cursor:pointer;background:var(--color-accent);color:var(--color-bg);
  font-size:11px;font-weight:800;letter-spacing:.08em;white-space:nowrap}
.nowbtn:hover{background:var(--color-accent-600)}
.nowbtn[hidden]{display:none}
.step{width:34px;height:34px;font-size:20px;display:grid;place-items:center;cursor:pointer;
  color:var(--color-neutral-700);font-size:16px;line-height:1}
.step:hover:not(:disabled){color:var(--color-accent)}
.step:disabled{opacity:.3;cursor:default}
.stamp{white-space:nowrap;margin:0 6px}
@media(max-width:479px){.stamp{display:none}}
@media(max-width:519px){.brand .word{display:none}}
@media(max-width:399px){.step{width:28px}.wklab{min-width:66px;font-size:11px}.icon{width:36px}.nowbtn{padding:0 7px}
  .livetag{padding:4px 6px;margin:0 2px 0 4px;letter-spacing:.08em}}
.icon{width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--color-neutral-700);flex:none}
.icon:hover:not(:disabled){color:var(--color-accent)}
.icon:disabled{opacity:.45;cursor:default}
.icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.icon.spin svg{animation:spin .8s linear infinite}
/* shown only while games are live, so its presence is the news */
.livetag{display:inline-flex;align-items:center;gap:6px;flex:none;margin:0 4px 0 6px;padding:4px 8px;
  background:var(--color-accent);color:var(--color-bg);font-size:10px;font-weight:800;letter-spacing:.12em;white-space:nowrap}
.livetag[hidden]{display:none}
.livetag i{width:6px;height:6px;background:currentColor;display:block;animation:blip 2s ease-in-out infinite}

/* ---------- shared bits ---------- */
.err{background:var(--color-accent-100);border-bottom:2px solid var(--color-accent);padding:10px 14px;flex:none}
.err .t{font-size:13px;font-weight:800;color:var(--color-accent-700)}
.err .d{font-size:13px;color:var(--color-neutral-800)}
.loading{padding:40px 14px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr}
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.band{display:flex;align-items:center;gap:var(--space-2);padding:9px 14px;flex:none;
  background:var(--color-surface);border-bottom:2px solid var(--color-divider)}
.note{padding:10px 14px 14px;border-bottom:1px solid var(--color-divider);font-size:13px;color:var(--color-neutral-800)}

/* ---------- home: league cells ---------- */
.lgrid{border-bottom:2px solid var(--color-divider);flex:none}
.cell{padding:12px 12px 13px;text-align:left;cursor:pointer;background:var(--color-bg);width:100%;
  display:flex;flex-direction:column}
.cell:hover,.cell.sel{background:var(--lg-tint,var(--color-accent-100))}
.lgrid .cell{box-shadow:inset 0 4px 0 var(--lg);padding-top:16px}
.cells .cell:nth-child(2n){border-left:2px solid var(--color-divider)}
.lgrid .cell:nth-child(n+3){border-top:2px solid var(--color-divider)}
/* under two columns the vertical rules become horizontal ones */
@media(max-width:359px){
  .cells .cell:nth-child(2n){border-left:0}
  .lgrid .cell+.cell{border-top:2px solid var(--color-divider)}
}
.chead{display:flex;align-items:baseline;gap:6px}
/* the leader's score is the big one; a tie is two of the same size */
.cs{display:flex;align-items:baseline;gap:6px;min-width:0}
.cs .v{font-size:30px;line-height:1.05;letter-spacing:-.02em}
.cs.trail .v{font-size:20px;color:var(--color-neutral-600)}
.cs.tie .v{font-size:25px}
.cs .lb{font-size:9px}
.cs.first{margin-top:3px}
.cme{font-size:30px;line-height:1.05;margin-top:3px}
.matrix{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin-top:9px;max-width:260px}
.matrix i{aspect-ratio:1;display:block;background:var(--color-neutral-300)}
.matrix i.on{background:var(--color-accent)}
/* auto keeps the OPEN rule on the same line across cells of unequal text */
.cst{font-weight:800;color:var(--color-text)}
/* league rows: the many-leagues home */
.lrows{border-bottom:2px solid var(--color-divider);flex:none}
.lrow{display:flex;align-items:center;gap:10px;width:100%;min-height:64px;padding:10px 12px 10px 14px;text-align:left;cursor:pointer;
  background:var(--color-bg);border-bottom:1px solid var(--color-divider);box-shadow:inset 4px 0 0 var(--lg)}
.lrow:last-child{border-bottom:0}
.lrow:hover,.lrow:active,.lrow.sel{background:var(--lg-tint)}
.lrow>.key{min-width:22px;height:18px;font-size:10px}
.lrow .lmid{flex:1;min-width:0}
.lrow .lname{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lmid .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.wbar{height:3px;background:var(--color-neutral-300);margin-top:6px;max-width:160px}
.wbar i{display:block;height:3px;background:var(--color-accent)}
.lsc{flex:none;text-align:right;font-variant-numeric:tabular-nums}
.lsc .v{font-size:18px;line-height:1.1;font-weight:800}
.lsc .v.trail{font-size:14px;color:var(--color-neutral-600)}
.lsc .v.tie{font-size:16px}
.lrow .ar{flex:none;width:16px;font-size:17px;color:var(--lg);transition:transform .15s}
.lrow:hover .ar{transform:translateX(3px)}
/* the card's way in: a full-width bar in the league's color, pinned to the bottom so cards line up */
.cgo{display:flex;align-items:center;gap:8px;margin:10px -12px -13px;margin-top:auto;padding:11px 12px;min-height:40px;
  border-top:1px solid var(--color-divider);color:var(--lg);font-size:11px;font-weight:800;letter-spacing:.08em}
.cgo .ar{margin-left:auto;font-size:17px;line-height:1;transition:transform .15s}
.cell:hover .cgo,.cell:active .cgo{background:var(--lg);color:var(--on-league)}
.cell:hover .cgo .ar{transform:translateX(3px)}
.cell.sel .cgo{background:transparent;color:var(--color-neutral-700)}
.cell .bp{margin-bottom:10px}
/* a league's colored letter: solid where the player is yours, outlined where he starts against you */
.key{display:inline-grid;place-items:center;min-width:15px;height:15px;padding:0 3px;flex:none;align-self:center;
  font-size:9px;font-weight:800;letter-spacing:0;line-height:1;text-transform:uppercase;
  background:var(--lg,var(--color-text));color:var(--on-league)}
.key.vs{background:transparent;color:var(--lg);box-shadow:inset 0 0 0 1.5px var(--lg)}
.key.more{background:var(--color-surface);color:var(--color-neutral-800);box-shadow:inset 0 0 0 1px var(--color-divider)}
.nmrow .nm{flex:0 1 auto}
.chips{display:inline-flex;gap:3px;flex:none;align-items:center}
.nmrow{display:flex;align-items:center;gap:6px;min-width:0}
.nmrow .nm{min-width:0}
.chead .lb.ell{min-width:0}

/* ---------- home: game progress bar ---------- */
.track{height:3px;background:var(--color-neutral-300);margin-top:5px}
.track i{display:block;height:3px;background:var(--color-accent)}

/* ---------- footers ---------- */
.foot{border-top:2px solid var(--color-divider);display:flex;align-items:stretch;flex:none}
/* add to home screen: a quiet strip above the footer, never on a first visit */
.install{display:flex;align-items:center;gap:12px;flex:none;padding:10px 4px 10px 14px;
  border-top:2px solid var(--color-text);background:var(--color-surface);animation:fan .25s ease-out}
.install .im{flex:none;width:34px;height:34px}
.install .im svg{width:34px;height:34px;display:block}
.install .it{flex:1;min-width:0}
.install .t{font-size:14px;font-weight:800;line-height:1.25}
.install .d{font-size:12px;line-height:1.35;color:var(--color-neutral-800);margin-top:1px}
.install .btn{flex:none;padding:9px 14px;font-size:13px}
.install .x{flex:none;width:36px;height:44px;display:grid;place-items:center;cursor:pointer;font-size:22px;line-height:1;color:var(--color-neutral-700)}
.install .x:hover{color:var(--color-accent)}
.steps{list-style:none;margin:4px 0 0;padding:0;counter-reset:st}
.steps li{counter-increment:st;display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--color-divider);font-size:15px}
.steps li::before{content:counter(st);flex:none;width:24px;height:24px;display:grid;place-items:center;
  background:var(--color-accent);color:var(--color-bg);font-size:12px;font-weight:800}
.steps .ico{display:inline-grid;place-items:center;width:26px;height:26px;vertical-align:-7px;margin:0 2px;
  border:1px solid var(--color-divider);background:var(--color-bg)}
.steps .ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot .main{flex:1;min-width:0;padding:11px 12px;text-align:left}
.foot .main .v{font-size:15px;font-variant-numeric:tabular-nums;font-weight:800}
button.main{cursor:pointer}
button.main:hover{background:var(--color-accent-100)}
.alertbtn{width:118px;flex:none;border-left:2px solid var(--color-divider);background:var(--color-accent);
  color:var(--color-bg);padding:11px 12px;text-align:left;cursor:pointer}
.alertbtn:hover{background:var(--color-accent-600)}
.alertbtn .k{font-size:10px;font-weight:600;letter-spacing:.12em;opacity:.85}
.alertbtn .v{font-size:15px;font-weight:800;letter-spacing:.02em}
.alertbtn.clear{background:var(--color-surface);color:var(--color-text);cursor:default}
.alertbtn.clear .k{color:var(--color-neutral-700);opacity:1}

/* ---------- detail ---------- */
.detail{flex:1;display:flex;flex-direction:column;min-height:0}
.detail.enter{animation:slidein .22s ease-out}   /* only when it arrives as a navigation */
/* phones: the league view scrolls as one page. Only the tabs stay, and once the big score has
   scrolled away a slim score bar slides in above them. The bar is drawn over the space the score
   left (sticky offsets don't move the layout), so nothing below it jumps. */
.pane.detail.flowy{display:block;overflow-y:auto;position:relative}
.flowy .list{flex:none;min-height:0}
.dstick{position:sticky;top:0;z-index:6;background:var(--color-bg)}
.dstick.stuck{top:44px}
.mini{position:absolute;left:0;right:0;bottom:100%;height:44px;width:100%;display:flex;align-items:center;gap:8px;padding:0 14px;
  text-align:left;cursor:pointer;background:var(--color-bg);box-shadow:inset 0 3px 0 var(--lg),inset 0 -1px 0 var(--color-divider);
  opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .18s,transform .18s}
.dstick.stuck .mini{opacity:1;pointer-events:auto;transform:none}
.mini .ms{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--color-neutral-600);letter-spacing:-.01em}
.mini .ms.lead{color:var(--color-text)}
.mini .dash{color:var(--color-neutral-500)}
.mini .mw{margin-left:auto;white-space:nowrap}
.mini .up{font-size:15px;color:var(--lg);margin-left:4px}
.back{display:flex;align-items:center;gap:8px;padding:10px 14px;width:100%;text-align:left;cursor:pointer;flex:none;
  border-bottom:1px solid var(--color-divider)}
.back:hover{background:var(--color-accent-100)}
.back .t{font-size:11px;font-weight:800;letter-spacing:.1em}
.switch{border-bottom:2px solid var(--color-divider);flex:none}
/* more than two leagues: one row that scrolls sideways, the open league brought into view */
.switch.strip{display:flex;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.switch.strip::-webkit-scrollbar{display:none}
.switch.strip .sw{flex:none;width:auto;min-width:132px;max-width:210px;scroll-snap-align:start}
.switch.strip .sw+.sw{border-left:1px solid var(--color-divider)}
.sw .nm .ell{min-width:0}
.sw{padding:11px 14px;text-align:left;cursor:pointer;min-height:48px;background:var(--color-bg);
  color:var(--color-neutral-600);display:block;width:100%}
.sw .nm{font-size:11px;font-weight:800;letter-spacing:.1em}
.sw:hover{background:var(--lg-tint)}
.sw .nm{display:flex;align-items:center;gap:6px}
.sw[aria-pressed=true]{background:var(--lg);color:var(--on-league)}
.sw[aria-pressed=true]:hover{background:var(--lg)}
.sw[aria-pressed=true] .lb{color:var(--on-league);opacity:.85}
.sw[aria-pressed=true] .key{background:var(--on-league);color:var(--lg)}
.score{display:flex;flex:none;box-shadow:inset 0 4px 0 var(--lg)}
.lghead{display:flex;align-items:center;gap:8px;margin:2px 0 12px;min-width:0}
.lghead img{width:24px;height:24px;object-fit:cover;flex:none;display:block;background:var(--color-surface)}
.lghead .t{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--lg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lghead .lb{margin-left:auto;flex:none}
.score .body{flex:1;min-width:0;padding:14px 14px 13px}
.big{font-size:clamp(46px,13.5vw,66px);line-height:.86;letter-spacing:-.035em}
.big.trail{font-size:clamp(32px,9vw,44px);line-height:.88;letter-spacing:-.03em;color:var(--color-neutral-600)}
.big.tie{font-size:clamp(38px,11vw,54px);line-height:.87}
.srule{height:2px;background:var(--color-divider);margin:12px 0}
.gauge{width:64px;flex:none;border-left:2px solid var(--color-divider);display:flex;flex-direction:column;
  padding:10px 0;gap:3px;align-items:center}
.gauge .gp{font-size:19px;line-height:1;letter-spacing:-.02em}
.gauge .lb{font-size:9px;margin:3px 0 8px}
.gauge i{width:22px;height:9px;flex:none;display:block;background:var(--color-neutral-300)}
.gauge i.on{background:var(--color-accent)}
.tabs{display:flex;gap:18px;padding:0 14px;flex:none;overflow-x:auto;scrollbar-width:none;
  border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider)}
.tabs button{flex:none;white-space:nowrap;padding:12px 0 10px;cursor:pointer;font-size:12px;letter-spacing:.08em;font-weight:600;
  color:var(--color-neutral-600)}
.tabs button:hover{color:var(--color-accent)}
.tabs button[aria-selected=true]{font-weight:800;color:var(--color-text);
  border-bottom:3px solid var(--lg,var(--color-accent));margin-bottom:-2px}
/* five tabs on a small phone: close up the gaps rather than scroll */
@media(max-width:419px){.tabs{gap:14px}}
@media(max-width:389px){.tabs{gap:10px;padding:0 12px}}

/* ---------- rows ---------- */
/* wide: games flow into columns; an open one spans them */
.list.wide .flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));align-content:start}
.list.wide .flow .exp,.list.wide .flow .row.on{grid-column:1/-1}
/* lineup: starters and bench stacked, side by side when wide, each reading straight down */
.cols{display:grid;grid-template-columns:minmax(0,1fr);align-items:start}
.cols .col{min-width:0}
.list.wide .cols{grid-template-columns:repeat(2,minmax(0,1fr))}
.list.wide .cols .col+.col{border-left:2px solid var(--color-divider)}
/* matchup: one row per lineup slot, you on the left, them on the right */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr);border-bottom:1px solid var(--color-divider)}
.mside{display:flex;align-items:center;gap:10px;padding:10px 12px;min-width:0;min-height:56px;width:100%;
  text-align:left;background:var(--color-bg)}
.mside.b{flex-direction:row-reverse;text-align:right}
button.mside{cursor:pointer}
button.mside:hover,.mside.on{background:var(--color-accent-100)}
.mside .mt{flex:1;min-width:0}
.mside .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mside .nm .short{display:none}
.mp{font-size:21px;line-height:1;width:48px;flex:none;color:var(--color-neutral-600)}
.mside.b .mp{text-align:right}
.mp.lead{color:var(--color-text)}
.mp.zero{color:var(--color-neutral-500)}
.mslot{display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--color-neutral-700);
  background:var(--color-surface);border-left:1px solid var(--color-divider);border-right:1px solid var(--color-divider)}
@media(max-width:599px){
  .mside{gap:6px;padding:9px 8px}
  .mside .nm{font-size:14px}
  .mside .nm .full{display:none}
  .mside .nm .short{display:inline}
  .mp{font-size:17px;width:38px}
  .mrow{grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr)}
}
.list.wide .mwrap,.list.wide .stand{max-width:1040px;border-right:2px solid var(--color-divider);min-height:100%}
/* league tab: a card per matchup, two across when wide, an opened one spanning both */
.lgames{display:grid;grid-template-columns:minmax(0,1fr);align-content:start}
.list.wide .lgames{grid-template-columns:repeat(2,minmax(0,1fr));max-width:1040px;border-right:2px solid var(--color-divider)}
.list.wide .lgames .gopen{grid-column:1/-1;max-width:none;border-right:0;min-height:0}
.list.wide .gcard:not(.on){box-shadow:inset -1px 0 0 var(--color-divider)}
.gcard{display:block;width:100%;text-align:left;cursor:pointer;background:var(--color-bg);padding:10px 14px 9px;
  border-bottom:1px solid var(--color-divider)}
.gcard:hover,.gcard.on{background:var(--lg-tint)}
.gcard.mine,.list.wide .gcard.mine:not(.on){box-shadow:inset 4px 0 0 var(--lg)}
.gt{display:flex;align-items:center;gap:10px;min-height:36px}

<script>
"use strict";
/* ============================================================
   A single-page Sleeper scoreboard for people in more than one
   league, dressed in the Modernist design system.

   Data: api.sleeper.app (rosters, matchups, players, projections, stats)
         sleeper.com/graphql (live NFL game clocks)
   No server, no keys. Everything below is plain browser JS.
   ============================================================ */

const DEFAULTS = { username:"", refresh:45, theme:"light" };   // no username until the visitor gives one
const SPORT   = "nfl";
const SLEEPER = "https://api.sleeper.app";
const GQL     = "https://sleeper.com/graphql";
const CELLS   = 20;                       // win-probability matrix cells

/* ---------- state ---------- */
const S = {
  cfg:{...DEFAULTS},
  week:null, curWeek:null, season:null, userId:null,
  leagues:[], players:{}, proj:{}, lastProj:0, projWeek:null,
  games:[], byTeam:{}, own:{},
  view:"home", league:null, tab:"mine", open:new Set(), modal:null,
  onboard:{value:"", err:null, busy:false},
  wide: window.matchMedia("(min-width:900px)").matches,
  prevPts:{}, deltas:{}, statCache:{}, err:null, booted:false, updated:null, anim:false,
  demo: new URLSearchParams(location.search).get("demo")==="live",
  /* ?demo=live&leagues=N swaps your leagues for N sample ones (1–12) */
  demoN: new URLSearchParams(location.search).get("demo")==="live" ? Math.min(12, Math.max(0, parseInt(new URLSearchParams(location.search).get("leagues"),10)||0)) : 0,
};

/* ---------- helpers ---------- */
const $  = s => document.querySelector(s);
const el = (t,c,x) => { const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; };
const lb = (x,c) => el("div","lb"+(c?" "+c:""),x);   // a label is its own line, even inside a flex row
const f1 = n => (Math.round((n||0)*10)/10).toFixed(1);
const f2 = n => (Math.round((n||0)*100)/100).toFixed(2);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
async function getJSON(url){
  const r = await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error(url.replace(/^https?:\/\/[^/]+/,"")+" returned "+r.status);
  return r.json();
}
function erf(x){ const s=x<0?-1:1; x=Math.abs(x); const t=1/(1+0.3275911*x);
  return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x)); }
const normCdf = z => 0.5*(1+erf(z/Math.SQRT2));
const isCurrent = () => S.week === S.curWeek;
const timeStr = d => d.toLocaleTimeString([], {weekday:"short",hour:"numeric",minute:"2-digit"});
const hhmm    = d => d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
const slotLabel = s => String(s||"").replace(/_/g," ");
/* win odds as a percentage; while anything is left to play it never says 0% or 100% */
const pct = p => { const n=Math.round(p*100); return n<1 ? "<1%" : n>99 ? ">99%" : n+"%"; };
/* analytics: what happened, never whose leagues (see /assets/analytics.js) */
const track = (name, params) => { if(S.demo) return; try{ window.arTrack && window.arTrack(name, params); }catch(e){} };
const bucket = n => n<=1 ? "1" : n<=4 ? "2-4" : n<=9 ? "5-9" : "10+";
const SLOT_SHORT = {FLEX:"FLX",SUPER_FLEX:"SF",REC_FLEX:"W/T",WRRB_FLEX:"W/R",IDP_FLEX:"IDP"};
const SLOT_NAME  = {FLEX:"FLEX",SUPER_FLEX:"SUPERFLEX",REC_FLEX:"WR/TE FLEX",WRRB_FLEX:"WR/RB FLEX",IDP_FLEX:"IDP FLEX"};
const slotShort = s => SLOT_SHORT[s] || slotLabel(s);
const sameDay = (a,b) => a.toDateString()===b.toDateString();
/* "TODAY", "TOMORROW", or "THU" — a kickoff time means little without its day */
function dayOf(d){
  const now=new Date(), tmr=new Date(now); tmr.setDate(now.getDate()+1);
  return sameDay(d,now) ? "TODAY" : sameDay(d,tmr) ? "TOMORROW"
    : d.toLocaleDateString([], {weekday:"short"}).toUpperCase();
}
const whenStr = d => sameDay(d,new Date()) ? hhmm(d) : `${d.toLocaleDateString([], {weekday:"short"})} ${hhmm(d)}`;

/* ---------- config ---------- */
function loadCfg(){
  const c = store.get("sb_cfg") || {};
  S.cfg = {...DEFAULTS, ...c};
  applyTheme(S.cfg.theme);
}
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  $('meta[name=theme-color]').content = t==="dark" ? "#1a1918" : "#f3f2f2";
}
function saveCfg(){ if(!S.demo) store.set("sb_cfg", S.cfg); }   // a demo never changes what's saved

/* Check a username against Sleeper before it replaces the saved one, so a typo
   never wipes out leagues that were working. Returns an error message, or null. */
async function adoptUser(name, source){
  name = String(name||"").trim().replace(/^@/,"");
  if(!name) return "Enter your Sleeper username.";
  let u;
  try{ u = await getJSON(`${SLEEPER}/v1/user/${encodeURIComponent(name)}`); }
  catch(e){ return "Couldn't reach Sleeper. Check your connection and try again."; }
  track("username_submitted", {found: !!(u && u.user_id), source: source||"onboarding"});
  if(!u || !u.user_id) return `Sleeper has no user named "${name}".`;
  S.cfg.username = u.username || name;
  saveCfg();
  /* ask the browser not to clear this site's storage under pressure; granted or not, nothing breaks */
  try{ navigator.storage?.persist?.().catch(()=>{}); }catch(e){}
  S.leagues=[]; S.league=null; S.view="home"; S.prevPts={}; S.deltas={}; S.open=new Set();
  S.userId=null; S.err=null; S.modal=null; S.onboard={value:"",err:null,busy:false};
  refresh(true);
  return null;
}
function forgetUser(){
  S.cfg.username=""; saveCfg();
  S.leagues=[]; S.league=null; S.view="home"; S.userId=null; S.err=null; S.modal=null;
  render();
}
/* the link that brings these leagues back on any browser: /scoreboard?user=name */
const userLink = () => `${location.origin}${location.pathname}?user=${encodeURIComponent(S.cfg.username)}`;

/* ============================================================
   GAME CLOCK
   ============================================================ */
function fractionLeft(g){
  if(!g) return 0;
  if(g.state==="pre")  return 1;
  if(g.state==="post") return 0;
  if(g.period>4) return 0.03;
  const [m,s] = String(g.clock||"0:00").split(":").map(Number);
  const left = (isFinite(m)?m:0) + (isFinite(s)?s:0)/60 + (4-g.period)*15;
  return clamp(left/60, 0.02, 1);
}

/* ============================================================
   FETCH
   ============================================================ */
async function loadState(){
  const st = await getJSON(`${SLEEPER}/v1/state/${SPORT}`);
  S.curWeek = st.display_week || st.week || 1;
  S.season  = st.season;
  if(S.week==null) S.week = S.curWeek;
}

/* a short, unique code per league: "D", then "D2" for "Dynasty 2", "DO" for "Degens Only", "DE"… */
function leagueKeys(names){
  const used=new Set();
  return names.map((n,i)=>{
    const up=n.toUpperCase(), words=up.split(/[^A-Z0-9]+/).filter(Boolean);
    const letters=up.replace(/[^A-Z]/g,""), first=letters[0]||"L", digit=(up.match(/\d/)||[])[0];
    const k=[first, digit&&first+digit, words[1]&&first+words[1][0], letters.slice(0,2), first+(i+1)]
      .find(c=>c && !used.has(c)) || String(i+1);
    used.add(k); return k;
  });
}

async function loadShell(){
  const u = await getJSON(`${SLEEPER}/v1/user/${encodeURIComponent(S.cfg.username)}`);
  if(!u || !u.user_id) throw new Error(`No Sleeper user named "${S.cfg.username}". Open settings to fix it`);
  S.userId = u.user_id;
  const lgs = await getJSON(`${SLEEPER}/v1/user/${S.userId}/leagues/${SPORT}/${S.season}`);
  if(!lgs.length) throw new Error(`${S.cfg.username} has no ${S.season} leagues`);
  S.allLeagues = lgs.map(l=>({id:l.league_id, name:(l.name||"League").trim()}));
  const hidden = new Set(S.cfg.hidden||[]);
  let shown = lgs.filter(l=>!hidden.has(l.league_id));
  if(!shown.length) shown = lgs;
  const keys = leagueKeys(shown.map(l=>(l.name||"League").trim()));
  S.leagues = shown.map((l,i)=>{
    const name = (l.name||"League").trim();
    const key = keys[i];
    return { id:l.league_id, name, key, ci:i%8, avatar:l.avatar||null, rec: l.scoring_settings?.rec ?? 1,
             scoring: l.scoring_settings || {}, slots:l.roster_positions||[] };
  });
  if(S.league && !S.leagues.some(l=>l.id===S.league)){ S.league=null; S.view="home"; }
  if(!S.tracked){
    S.tracked=true;

async function loadLeague(L){
  const [rosters,users,matchups] = await Promise.all([
    getJSON(`${SLEEPER}/v1/league/${L.id}/rosters`),
    getJSON(`${SLEEPER}/v1/league/${L.id}/users`),
    getJSON(`${SLEEPER}/v1/league/${L.id}/matchups/${S.week}`).catch(()=>[])
  ]);
  hydrateLeague(L, rosters, users, matchups);
}
function hydrateLeague(L, rosters, users, matchups){
  L.userById = {}; for(const u of users) L.userById[u.user_id] = u;
  L.rosters  = rosters; L.matchups = matchups; L.error = null;
  L.teamName = r => { const u=r&&L.userById[r.owner_id]; return u?.metadata?.team_name || u?.display_name || "Team"; };
  L.userName = r => L.userById[r?.owner_id]?.display_name || "";

  const mine = rosters.find(r=>r.owner_id===S.userId || (r.co_owners||[]).includes(S.userId));
  if(!mine){ L.error="You're not on a roster in this league"; L.mine=[]; L.them=[]; return; }
  L.myRoster = mine;
  const mm  = matchups.find(m=>m.roster_id===mine.roster_id);
  const opp = mm ? matchups.find(m=>m.matchup_id===mm.matchup_id && m.roster_id!==mine.roster_id) : null;
  const oppR = opp ? rosters.find(r=>r.roster_id===opp.roster_id) : null;
  L.oppRoster = oppR;
  L.myName=L.teamName(mine); L.oppName=oppR?L.teamName(oppR):null;
  L.myPts=mm?.points??0; L.oppPts=opp?.points??0; L.hasMatchup=!!mm;
  L.mine = buildSide(mm,mine,L); L.them = opp?buildSide(opp,oppR,L):[];
  L.record = recordOf(mine);

  /* the whole week in this league: each matchup's two teams, yours reusing the sides built above */
  const byMid=new Map();
  for(const m of matchups){ if(m.matchup_id==null) continue; if(!byMid.has(m.matchup_id)) byMid.set(m.matchup_id,[]); byMid.get(m.matchup_id).push(m); }
  L.pairs=[...byMid.entries()].sort((a,b)=>a[0]-b[0]).map(([mid,ms])=>{
    const teams=ms.slice(0,2).map(m=>{
      const r=rosters.find(x=>x.roster_id===m.roster_id);
      const side = r===mine ? L.mine : r===oppR ? L.them : buildSide(m,r,L);
      return { roster:r, pts:m.points??0, side, mine:r===mine, name:L.teamName(r), user:L.userName(r), record:recordOf(r),
               avatar:L.userById[r?.owner_id]?.avatar||null };
    });
    if(teams[1]?.mine) teams.reverse();
    return { mid, teams, mine:teams.some(t=>t.mine) };
  });
  const paired=new Set(matchups.filter(m=>m.matchup_id!=null).map(m=>m.roster_id));
  L.byes=rosters.filter(r=>!paired.has(r.roster_id)).map(r=>L.teamName(r));
}
const recordOf = r => `${r?.settings?.wins??0}-${r?.settings?.losses??0}${r?.settings?.ties?`-${r.settings.ties}`:""}`;

function buildSide(m, roster, L){
  const startIds = m?.starters || roster?.starters || [];
  const allIds   = m?.players  || roster?.players  || [];
  const ptsMap   = m?.players_points || {};
  const out=[], seen=new Set();
  startIds.forEach((pid,i)=>{ if(!pid || pid==="0") out.push({pid:`empty-${i}`, name:"Empty "+(slotLabel(L.slots[i])||"")+" slot",
    pos:L.slots[i]||"", team:"", starter:true, empty:true, pts:0, league:L, slot:L.slots[i], slotIndex:i}); });
  for(const pid of allIds){
    if(!pid||seen.has(pid)) continue; seen.add(pid);
    const info=S.players[pid]||{n:pid,pos:"",team:"",inj:""};
    const i=startIds.indexOf(pid);
    out.push({pid, name:info.n, pos:info.pos, team:info.team, inj:info.inj, starter:i>=0,
      slot:i>=0?L.slots[i]:"", slotIndex:i>=0?i:-1, pts:ptsMap[pid]??0, league:L});
  }
  return out;
}

/* ============================================================
   MODELS: win probability, lineup alerts, best lineup
   ============================================================ */
function projectSide(players, L){
  let rem=0, v=0, left=0, total=0;
  for(const p of players){
    if(!p.starter) continue; total++;
    if(p.empty) continue;
    const fr = fractionLeft(S.byTeam[p.team]);
    if(fr<=0) continue;
    if(isOut(p)) continue;
    left++;
    const pj=projFor(p,L); rem+=pj*fr; const sd=Math.max(3,pj*0.55)*Math.sqrt(fr); v+=sd*sd;
  }
  return {rem, sd:Math.sqrt(v), left, total};
}
/* the chance side A outscores side B, from points on the board and what's left to play */
function pairProb(A, B, ptsA, ptsB, L){
  const a=projectSide(A,L), b=projectSide(B,L);
  const diff=(ptsA+a.rem)-(ptsB+b.rem), sd=Math.sqrt(a.sd*a.sd+b.sd*b.sd);
  const p = sd<0.5 ? (diff>0?1:diff<0?0:0.5) : normCdf(diff/sd);
  return { p:clamp(p,0.001,0.999), projA:ptsA+a.rem, projB:ptsB+b.rem, leftA:a.left, leftB:b.left, total:a.total,
           decided:a.left===0&&b.left===0, margin:ptsA-ptsB };
}
function winProb(L){
  if(!L.hasMatchup||!L.them.length) return null;
  const w=pairProb(L.mine,L.them,L.myPts,L.oppPts,L);
  return { p:w.p, projMe:w.projA, projOpp:w.projB, left:w.leftA, total:w.total, oppLeft:w.leftB, decided:w.decided, margin:w.margin };
}
const OUT = new Set(["Out","IR","PUP","Sus","COV","NA","Doubtful"]);
const isOut = p => OUT.has(p.inj);

const ELIG = {QB:["QB"],RB:["RB"],WR:["WR"],TE:["TE"],K:["K"],DEF:["DEF"],
  FLEX:["RB","WR","TE"],SUPER_FLEX:["QB","RB","WR","TE"],REC_FLEX:["WR","TE"],WRRB_FLEX:["RB","WR"],
  DL:["DL"],LB:["LB"],DB:["DB"],IDP_FLEX:["DL","LB","DB"]};

/* the highest-scoring legal lineup out of everyone rostered, and who filled each slot */
function bestLineup(players, slots){
  const order = slots.map((s,i)=>({s,i})).filter(x=>ELIG[x.s])
                     .sort((a,b)=>ELIG[a.s].length-ELIG[b.s].length);   // tightest slots first
  const pool = players.filter(p=>!p.empty).sort((a,b)=>b.pts-a.pts);
  const taken=new Set(); let total=0; const picks=[];
  for(const {s,i} of order){
    const pick = pool.find(p=>!taken.has(p.pid) && ELIG[s].includes(p.pos));
    if(pick){ taken.add(pick.pid); total+=pick.pts; picks.push({slot:s, slotIndex:i, p:pick}); }
  }
  return {total, picks};
}
function benchStory(L){
  const {total,picks} = bestLineup(L.mine||[], L.slots||[]);
  const gain = total - (L.myPts||0);
  const swaps = [];
  for(const pk of picks){
    if(pk.p.starter) continue;
    const cur = (L.mine||[]).find(p=>p.starter && p.slotIndex===pk.slotIndex);
    const who = !cur || cur.empty ? `the empty ${slotLabel(pk.slot)} slot` : cur.name;
    swaps.push(`${pk.p.name} at ${slotLabel(pk.slot)} instead of ${who}`);
  }
  return {gain:Math.max(0,gain), swaps};
}
function benchPts(L){ return (L.mine||[]).filter(p=>!p.starter&&!p.empty).reduce((a,p)=>a+(p.pts||0),0); }

/* who could still be swapped in for a slot, best projection first */
function benchFor(L, slot){
  const ok = ELIG[slot] || [];
  return (L.mine||[]).filter(p=>!p.starter && !p.empty && ok.includes(p.pos) && !isOut(p)
      && fractionLeft(S.byTeam[p.team])>0)
    .sort((a,b)=>projFor(b,L)-projFor(a,L));
}
function lineupAlerts(L){
  const out=[];
  for(const p of L.mine||[]){
    if(!p.starter) continue;
    const g=S.byTeam[p.team];
    if(g && g.state==="post") continue;               // too late to matter
    const opts = benchFor(L, p.slot).slice(0,2).map(x=>x.name);
    const bench = opts.length ? `bench has ${opts.join(" and ")}` : "nobody free on your bench";
    if(p.empty) out.push({league:L, text:`Empty ${slotLabel(p.slot)||""} slot`.replace("  "," "),
      sub:`Nobody assigned · ${bench}`});
    else if(!g && p.team) out.push({league:L, text:`${p.name} is on bye`, sub:`${p.pos} · no game this week · ${bench}`});
    else if(isOut(p)) out.push({league:L, text:`${p.name} is ${p.inj}`,
      sub:`${[p.pos,p.team].filter(Boolean).join(" ")} · ${gameLabel(p.team).txt} · ${bench}`});
  }
  return out;
}
const allAlerts = () => S.leagues.flatMap(lineupAlerts);

/* every league a player shows up in, on either side of my matchup */
function ownership(){
  const m={};
  for(const L of S.leagues){
    for(const p of L.mine||[]) if(!p.empty) (m[p.pid]=m[p.pid]||[]).push({L,mine:true,starter:p.starter,pts:p.pts});
    for(const p of L.them||[]) if(!p.empty) (m[p.pid]=m[p.pid]||[]).push({L,mine:false,starter:p.starter,pts:p.pts});
  }
  return m;
}
/* a league's colored letter; outlined means the player starts against you there */
function chip(L, vs){
  const c=el("span","key lg"+L.ci+(vs?" vs":""),L.key);
  c.title = vs ? `Starting against you in ${L.name}` : `Yours in ${L.name}`;

/* chips for every league a player matters in: all of them, or all but `except` */
function leagueChips(pid, except, startersOnly){
  const list=[], seen=new Set();
  for(const x of S.own[pid]||[]){
    if(x.L===except || seen.has(x.L)) continue;
    if(x.mine && (x.starter || !startersOnly)){ list.push([x.L,false]); seen.add(x.L); }
    else if(!x.mine && x.starter){ list.push([x.L,true]); seen.add(x.L); }
  }
  if(!list.length || S.leagues.length<2) return null;
  /* a player in ten leagues shouldn't push his own name off the row: two chips, then a count */
  const box=el("span","chips"), max=3, cut=list.length>max ? max-1 : list.length;
  for(const [L,vs] of list.slice(0,cut)) box.appendChild(chip(L,vs));
  if(list.length>cut){
    const more=el("span","key more","+"+(list.length-cut));
    more.title=list.slice(cut).map(([L,vs])=>(vs?"Against you in ":"Yours in ")+L.name).join("\n");
    box.appendChild(more);
  }
  return box;
}
function rosteredText(pid, fallback){
  const e=S.own[pid]||[];
  if(!e.length) return fallback||"";
  return e.map(x=> x.mine ? `${x.L.name} ${x.starter?"starting":"bench"}` : `against you in ${x.L.name}`).join(" · ");
}

/* ============================================================
   STAT LINES
   ============================================================ */
const STAT_ORDER = {
  QB:["pass_cmp","pass_att","pass_yd","pass_td","pass_int","pass_2pt","rush_att","rush_yd","rush_td","fum_lost"],
  RB:["rush_att","rush_yd","rush_td","rec_tgt","rec","rec_yd","rec_td","fum_lost"],
  WR:["rec_tgt","rec","rec_yd","rec_td","rush_att","rush_yd","rush_td","fum_lost"],
  TE:["rec_tgt","rec","rec_yd","rec_td","fum_lost"],
  K :["fgm","fga","fgm_50p","xpm","fgmiss","xpmiss"],
  DEF:["sack","int","fum_rec","def_td","safe","blk_kick","pts_allow","yds_allow"],
};
const STAT_LABEL = {
  pass_cmp:"completions", pass_att:"pass attempts", pass_yd:"passing yards", pass_td:"passing TD",
  pass_int:"interceptions thrown", pass_2pt:"2-point pass", rush_att:"carries", rush_yd:"rushing yards",
  rush_td:"rushing TD", rush_2pt:"2-point rush", rec:"receptions", rec_tgt:"targets", rec_yd:"receiving yards",
  rec_td:"receiving TD", rec_2pt:"2-point catch", fum_lost:"fumbles lost", fum:"fumbles",
  fgm:"field goals", fga:"attempts", fgm_50p:"from 50+", xpm:"extra points", fgmiss:"missed FG",
  xpmiss:"missed XP", sack:"sacks", int:"interceptions", fum_rec:"fumble recoveries", def_td:"defensive TD",
  safe:"safeties", blk_kick:"blocked kicks", pts_allow:"points allowed", yds_allow:"yards allowed",
};
const prettyStat = k => STAT_LABEL[k] || k.replace(/_/g," ");
const fmtStat = v => Number.isInteger(v) ? String(v) : String(Math.round(v*10)/10);

/* one line per stat, priced with this league's own scoring settings */
function breakdown(p, L, st){
  if(!st) return [];
  const sc=(L&&L.scoring)||{}, out=[], used=new Set();
  /* a stat the league doesn't price (carries, targets) is context, not points */
  const push=k=>{ const v=st[k]; if(v==null||v===0||used.has(k)) return; used.add(k);
    out.push({v:fmtStat(v), label:prettyStat(k), pts: sc[k] ? sc[k]*v : null}); };
  for(const k of (STAT_ORDER[p.pos]||[])) push(k);
  const extra = Object.keys(st).filter(k=>!used.has(k) && sc[k]!=null && st[k] && Math.abs(sc[k]*st[k])>=0.05 && !/^pts_/.test(k));
  extra.sort((a,b)=>Math.abs(sc[b]*st[b])-Math.abs(sc[a]*st[a]));
  for(const k of extra.slice(0,6)) out.push({v:fmtStat(st[k]), label:prettyStat(k), pts:sc[k]*st[k]});
  if(st.off_snp && st.tm_off_snp) out.push({v:Math.round(100*st.off_snp/st.tm_off_snp)+"%", label:"of snaps", pts:null});
  return out;
}
const statKey = pid => `${pid}:${S.week}`;
async function statsFor(pid){
  const k=statKey(pid);
  if(S.statCache[k]!==undefined) return S.statCache[k];
  try{
    const d = await getJSON(`${SLEEPER}/stats/${SPORT}/player/${pid}?season_type=regular&season=${S.season}&grouping=week`);
    return S.statCache[k] = (d?.[String(S.week)]?.stats || null);

/* ============================================================
   RENDER — shared pieces
   ============================================================ */
function gameLabel(team){
  const g=S.byTeam[team];
  if(!g) return {txt:team?"On bye":"No game", clock:"—", sub:"NO GAME", live:false, phase:"none", frac:0};
  const line = g.state==="post" ? `Final · ${g.away} ${g.awayScore} ${g.home} ${g.homeScore}`
    : g.state==="in" ? `${g.period>4?"OT":"Q"+g.period} ${g.clock} · ${g.away} ${g.awayScore} ${g.home} ${g.homeScore}`
    : `Kicks ${whenStr(g.start)} · ${g.away} at ${g.home}`;
  const other = team===g.home ? g.away : g.home;
  const mineScore = team===g.home ? g.homeScore : g.awayScore;
  const theirScore = team===g.home ? g.awayScore : g.homeScore;
  return {
    txt: line,
    clock: g.state==="post" ? "FINAL" : g.state==="in" ? `${g.period>4?"OT":"Q"+g.period} ${g.clock}` : hhmm(g.start),
    sub: g.state==="pre" ? `${dayOf(g.start).slice(0,3)} · ${g.away} AT ${g.home}` : `${team} ${mineScore}–${theirScore} ${other}`,
    live: g.state==="in", phase:g.state, frac:1-fractionLeft(g), game:g
  };
}
function paceOf(p, proj){
  const gl=gameLabel(p.team);
  if(!proj) return "NO PROJECTION";
  if(gl.phase==="none") return "NO GAME";
  if(gl.phase==="pre")  return "NOT STARTED";
  if(gl.phase==="post") return p.pts>=proj ? "BEAT PROJECTION" : "MISSED IT";
  return p.pts >= proj*gl.frac ? "AHEAD OF PACE" : "BEHIND PACE";
}

/* One thing open at a time. A key like "card/a:pid" lives inside "card", so opening a player in an
   opened matchup keeps the matchup open; opening anything else closes the rest. */
function toggle(key, pid, ev){
  if(S.open.has(key)){
    for(const k of [...S.open]) if(k===key || k.startsWith(key+"/")) S.open.delete(k);
  }else{
    if(ev) track(ev.name, ev.params);
    else track(pid ? "player_expanded" : "game_expanded", {tab: {mine:"lineup",them:"matchup",league:"league",clocks:"nfl",table:"standings"}[S.tab]||S.tab});
    for(const k of [...S.open]) if(!key.startsWith(k+"/")) S.open.delete(k);
    S.open.add(key);
    S.reveal={key, mode:"nearest"};
    /* the box score arrives after the drawer opens and makes it taller, so check again then */
    if(pid && S.statCache[statKey(pid)]===undefined)
      statsFor(pid).then(()=>{ if(S.open.has(key)) S.reveal={key, mode:"nearest"}; render(); });
  }
  render();
}

/* Scroll an opened item into view: "top" puts it just under the pinned tabs (arriving from the home
   screen), "nearest" moves only as far as needed to show the row and its whole drawer. */
function reveal({key, mode}){
  const t=document.querySelector(`#view [data-key="${CSS.escape(key)}"]`);
  if(!t) return;
  const row=t.closest(".mrow")||t;
  const c=row.closest(".pane.detail.flowy")||row.closest(".list.scroll");
  if(!c) return;
  let end=row;
  for(let n=row.nextElementSibling; n && (n.classList.contains("exp")||n.classList.contains("gopen")); n=n.nextElementSibling) end=n;
  const cr=c.getBoundingClientRect();
  const top=row.getBoundingClientRect().top-cr.top+c.scrollTop;
  const bottom=end.getBoundingClientRect().bottom-cr.top+c.scrollTop;
  const flowy=c.classList.contains("flowy"), cover=flowy?84:0, pad=8;
  let target=null;
  if(mode==="top") target=top-cover-pad;
  else{
    const viewTop=c.scrollTop+cover, viewBottom=c.scrollTop+c.clientHeight;
    if(top<viewTop) target=top-cover-pad;
    else if(bottom>viewBottom) target=Math.min(top-cover-pad, bottom-c.clientHeight+pad);
  }
  if(target==null) return;
  if(flowy && mode==="top") target=Math.max(target, c._tabTop());   // tuck the scores away so the drawer has room
  /* arriving from home, jump: the pane is already sliding in, and the box score's re-render would cut a smooth scroll short */
  c.scrollTo({top:Math.max(0,target), behavior: mode==="top" ? "auto" : "smooth"});
}

/* the drawer under a player row: score against projection, then the box score priced out */
function playerPanel(p, L, ctx){
  const w=el("div","exp");

  const top=el("div","exptop");
  const a=el("div"); a.appendChild(lb("SCORED")); a.appendChild(el("div","big3 n",f1(p.pts))); top.appendChild(a);
  const bar=el("div","expbar");
  const hd=el("div","hd"); hd.appendChild(lb("VS PROJECTION "+f1(proj))); hd.appendChild(lb(paceOf(p,proj)));
  bar.appendChild(hd);
  const track=el("div","bar");
  const fill=el("div","fill"+(proj&&p.pts>=proj?" beat":""));
  fill.style.width=clamp(proj?(p.pts/proj)*100:0,0,100).toFixed(0)+"%";
  track.appendChild(fill); track.appendChild(el("div","rest")); bar.appendChild(track);
  top.appendChild(bar); w.appendChild(top);

  const st=S.statCache[statKey(p.pid)];
  const lines=breakdown(p,L,st);

    const t=el("div","total"); t.appendChild(el("span","k","TOTAL SCORED"));

  }
  w.appendChild(box);

  const foot=el("div","expfoot");

  const r=el("div"); r.appendChild(lb("ROSTERED")); r.appendChild(el("div","v",rosteredText(p.pid,ctx)||"—")); foot.appendChild(r);
  w.appendChild(foot);
  return w;
}

   ============================================================ */
function leagueCell(L){
  const b=el("button","cell lg"+L.ci+(S.wide && L.id===detailLeague().id ? " sel":""));
  b.onclick=()=>openLeague(L.id,null,"card");
  const h=el("div","chead");
  h.appendChild(chip(L));
  h.lastChild.title=L.name;
  h.appendChild(lb(L.name.toUpperCase(),"lgc ell"));
  const rec=lb(L.record||""); rec.style.marginLeft="auto"; rec.style.flex="none"; h.appendChild(rec);
  b.appendChild(h);

  if(L.error){ b.appendChild(el("div","cme n","—")); b.appendChild(el("div","lb",L.error)); return b; }
  if(!L.hasMatchup){ b.appendChild(el("div","cme n","—")); b.appendChild(lb(`NO WEEK ${S.week} MATCHUP`)); return b; }

  const lead=leader(L);
  const line=(pts,who,side)=>{
    const r=el("div","cs "+(lead==="tie"?"tie":lead===side?"lead":"trail")+(side==="me"?" first":""));
    r.appendChild(el("span","v n",f2(pts))); r.appendChild(lb(who)); return r;
  };
  b.appendChild(line(L.myPts,"YOU","me"));
  b.appendChild(line(L.oppPts,"THEM","them"));

  const w=winProb(L);
  const on=w?Math.round(w.p*CELLS):0;
  const m=el("div","matrix");
  for(let i=0;i<CELLS;i++) m.appendChild(el("i",i<on?"on":null));
  b.appendChild(m);
  const wl=lb(!w ? "NO MATCHUP" : w.decided ? "FINAL · " : `${pct(w.p)} TO WIN · `);
  if(w) wl.appendChild(el("span","cst",statusOf(L)));
  b.appendChild(wl);

  /* before kickoff there's no bench story to tell, so show what's projected instead */
  let bp;
  if(!started(L)) bp=lb(w ? `PROJECTED ${f1(w.projMe)} – ${f1(w.projOpp)}` : "NOT STARTED");
  else{
    const bs=benchStory(L);
    bp=lb(`BENCH ${f1(benchPts(L))} · ${bs.gain>=0.05 ? "+"+f1(bs.gain)+" LEFT" : "NONE LEFT"}`, bs.gain>=0.05?"acc":null);
  }
  bp.style.marginTop="3px"; bp.classList.add("bp"); b.appendChild(bp);

  /* beside the open league on wide screens the bar has nowhere to go, so it says so */
  const showing = S.wide && L.id===detailLeague().id;
  const go=el("div","cgo");
  go.appendChild(el("span",null, showing ? "SHOWING AT RIGHT" : "MATCHUP & STATS"));
  if(!showing) go.appendChild(el("span","ar","→"));
  b.appendChild(go);
  b.setAttribute("aria-label", `${L.name}: ${f2(L.myPts)} to ${f2(L.oppPts)}, ${statusOf(L).toLowerCase()}. Open matchup and player stats`);
  return b;
}

/* "me", "them" or "tie", at the two decimals the scores are shown with */
function leader(L){
  const d=Math.round((L.myPts-L.oppPts)*100);
  return d>0 ? "me" : d<0 ? "them" : "tie";
}
const ROWS_AFTER = 4;
function leagueSummary(){
  const n={up:0,down:0,tie:0};
  for(const L of S.leagues){ if(!L.hasMatchup) continue; const l=leader(L); n[l==="me"?"up":l==="them"?"down":"tie"]++; }
  const final = S.games.length && S.games.every(g=>g.state==="post");
  const band=el("div","band");
  band.appendChild(lb(`${S.leagues.length} LEAGUES`));
  const t=lb([n.up&&`${n.up} ${final?"WON":"UP"}`, n.down&&`${n.down} ${final?"LOST":"DOWN"}`, n.tie&&`${n.tie} TIED`].filter(Boolean).join(" · ")||"—");
  t.style.marginLeft="auto"; t.classList.add("cst"); band.appendChild(t);
  return band;
}
function leagueRow(L){
  const sel = S.wide && L.id===detailLeague().id;
  const b=el("button","lrow lg"+L.ci+(sel?" sel":""));
  b.onclick=()=>openLeague(L.id,null,"row");
  b.appendChild(chip(L));
  const mid=el("div","lmid");
  mid.appendChild(el("div","lname",L.name));
  const w=L.hasMatchup ? winProb(L) : null;
  const meta=lb(L.error ? L.error : !L.hasMatchup ? `${L.record||""} · NO MATCHUP`
    : `${L.record} · ${w ? (w.decided ? "FINAL" : pct(w.p)+" TO WIN") : ""} · `);
  if(!L.error && L.hasMatchup) meta.appendChild(el("span","cst",statusOf(L)));
  mid.appendChild(meta);
  if(w && !w.decided){ const t=el("div","wbar"); const i=el("i"); i.style.width=Math.round(w.p*100)+"%"; t.appendChild(i); mid.appendChild(t); }
  b.appendChild(mid);
  if(L.hasMatchup && !L.error){
    const lead=leader(L), sc=el("div","lsc");
    const line=(pts,side)=>el("div","v n "+(lead==="tie"?"tie":lead===side?"lead":"trail"),f2(pts));
    sc.appendChild(line(L.myPts,"me")); sc.appendChild(line(L.oppPts,"them"));
    b.appendChild(sc);
  }
  b.appendChild(el("span","ar",sel?"":"→"));
  b.setAttribute("aria-label", `${L.name}: ${f2(L.myPts)} to ${f2(L.oppPts)}, ${statusOf(L).toLowerCase()}. Open matchup and player stats`);
  return b;
}
const started = L => !!(L.myPts || L.oppPts || [...(L.mine||[]),...(L.them||[])].some(p=>p.pts));
function statusOf(L){
  if(!L.hasMatchup) return "NO MATCHUP";
  const d=L.myPts-L.oppPts, w=winProb(L);
  const by = Math.abs(d)<0.1 ? f2(Math.abs(d)) : f1(Math.abs(d));
  if(leader(L)==="tie") return "TIED";
  if(w && w.decided) return `${d>0?"WON":"LOST"} BY ${by}`;
  return `${d>0?"UP":"DOWN"} ${by}`;
}
/* the next kickoffs that involve any of your starters */
function upNext(){
  const mine={};
  for(const L of S.leagues) for(const p of L.mine||[])
    if(p.starter && !p.empty && p.team && !(mine[p.team]?.has(p.pid))) (mine[p.team]=mine[p.team]||new Map()).set(p.pid,p);
  return S.games.filter(g=>g.state==="pre").sort((a,b)=>a.start-b.start)
    .map(g=>({g, ps:[...(mine[g.away]||new Map()).values(), ...(mine[g.home]||new Map()).values()]}))
    .filter(x=>x.ps.length).slice(0,8);
}

function liveStarters(){
  const out=[], seen=new Set();
  for(const L of S.leagues) for(const p of L.mine||[]){
    if(!p.starter||p.empty||seen.has(p.pid)) continue;
    const gl=gameLabel(p.team);
    if(!gl.live) continue;
    seen.add(p.pid); out.push({p,L,gl});
  }
  return out.sort((a,b)=>b.p.pts-a.p.pts);
}
/* one player per row: clock and game progress, who and where, points; league letters say which lineups */
function liveRow({p,L,gl}){
  const b=el("button","row live");
  b.onclick=()=>openLeague(L.id,p.pid,"live_player");
  const t=el("div","clk"); t.appendChild(el("div","ck n live",gl.clock));
  const tr=el("div","track"); const i=el("i"); i.style.width=Math.round(gl.frac*100)+"%"; tr.appendChild(i); t.appendChild(tr);
  b.appendChild(t);
  const mid=el("div","mid");
  const nr=el("div","nmrow"); nr.appendChild(el("div","nm",p.name));
  const ch=leagueChips(p.pid,null,true); if(ch) nr.appendChild(ch);
  mid.appendChild(nr);
  mid.appendChild(el("div","lb ell",[p.pos, gl.sub].filter(Boolean).join(" · ")));
  b.appendChild(mid);
  const pt=el("div","p n"+(p.pts?"":" zero")); pt.appendChild(el("span",null,f1(p.pts)));
  if(S.deltas[p.pid]) pt.appendChild(el("span","dl",(S.deltas[p.pid]>0?"+":"")+f1(S.deltas[p.pid])));
  b.appendChild(pt);
  return b;
}

function renderHome(v){
  const body=el("div","scroll");
  body.style.flex="1"; body.dataset.k="home";
  /* up to four leagues get cards; more than that and cards would bury everything else, so each league is a row */
  if(S.leagues.length>ROWS_AFTER){
    body.appendChild(leagueSummary());
    const list=el("div","lrows");
    for(const L of S.leagues) list.appendChild(leagueRow(L));
    body.appendChild(list);
  }else{
    const g=el("div","cells lgrid");
    for(const L of S.leagues) g.appendChild(leagueCell(L));
    body.appendChild(g);
  }

  const live=liveStarters();
  const up=isCurrent() ? upNext() : [];
  const band=(label,count)=>{ const b=el("div","band"); b.appendChild(lb(label)); const c=lb(count); c.style.marginLeft="auto"; b.appendChild(c); body.appendChild(b); };
  if(live.length){
    band("ON THE FIELD NOW", live.length+" PLAYING");
    live.forEach(x=>body.appendChild(liveRow(x)));
  }
  if(!live.length && !up.length) band("ON THE FIELD NOW","0 PLAYING");
  if(up.length){
    band("UP NEXT · YOUR STARTERS", up.length+(up.length>1?" GAMES":" GAME"));
    for(const {g,ps} of up){
      const r=el("div","row up");
      const t=el("div","clk"); t.appendChild(el("div","ck n",hhmm(g.start))); t.appendChild(lb(dayOf(g.start)));
      r.appendChild(t);
      const mid=el("div","mid");
      mid.appendChild(el("div","nm",`${g.away} at ${g.home}`));
      const pl=el("div","plist");
      for(const p of ps){
        const it=el("span","pl"); it.appendChild(el("span",null,p.name));
        const ch=leagueChips(p.pid,null,true); if(ch) it.appendChild(ch);
        pl.appendChild(it);
      }
      mid.appendChild(pl);
      r.appendChild(mid);
      body.appendChild(r);
    }
  }
  if(!live.length && !up.length){
    body.appendChild(el("div","note", !S.games.length ? "Live game clocks are unreachable. The scores above still work."
      : S.games.every(g=>g.state==="post") ? "Every game this week is final."
      : "Nobody of yours is on the field right now."));
  }
  v.appendChild(body);

  if(showInstallBanner()) v.appendChild(installBanner());
  const foot=el("div","foot");
  const next=[...S.games].filter(g=>g.state==="pre").sort((a,b)=>a.start-b.start)[0];
  const main=el("div","main");
  main.appendChild(lb(next?"NEXT KICKOFF":"KICKOFFS"));
  main.appendChild(el("div","v", next ? `${next.away} AT ${next.home} · ${whenStr(next.start).toUpperCase()}`
    : S.games.some(g=>g.state==="in") ? "EVERY GAME UNDER WAY" : "ALL GAMES FINAL"));
  foot.appendChild(main);

  const al=allAlerts();
  const ab=el(al.length?"button":"div","alertbtn"+(al.length?"":" clear"));
  ab.appendChild(el("div","k","LINEUP"));
  ab.appendChild(el("div","v",al.length?`${al.length} ALERT${al.length>1?"S":""}`:"ALL SET"));
  if(al.length) ab.onclick=()=>{ S.modal="alerts"; render(); };
  foot.appendChild(ab);
  v.appendChild(foot);
}

/* ============================================================
   ADD TO HOME SCREEN
   Chrome and Edge on Android hand us a real install prompt; Safari has no API,
   so iPhones and iPads get steps. An iPhone home-screen app keeps its own
   storage, so while the steps are open the address carries ?user=, which the
   app adopts on its first launch.
   ============================================================ */
const INSTALL = {
  prompt:null,
  standalone: matchMedia("(display-mode: standalone)").matches || navigator.standalone===true,
  android: /Android/i.test(navigator.userAgent),
  /* iPadOS reports itself as a Mac, so a Mac with a touchscreen is an iPad */
  ios: !/Android/i.test(navigator.userAgent) && (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1)),
  touch: matchMedia("(pointer:coarse)").matches,
  shown:false,
};
INSTALL.platform = INSTALL.ios ? "ios" : INSTALL.android ? "android" : INSTALL.touch ? "touch" : "desktop";
const installState = () => store.get("sb_install") || {};
const saveInstall = x => { if(!S.demo) store.set("sb_install", {...installState(), ...x}); };
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); INSTALL.prompt=e; render(); });
window.addEventListener("appinstalled", ()=>{ saveInstall({installed:true}); track("app_installed",{platform:INSTALL.platform}); render(); });

function showInstallBanner(){
  if(S.demo || INSTALL.standalone || !S.cfg.username || !S.leagues.length) return false;
  if(isCurrent() && S.games.some(g=>g.state==="in")) return false;   // scores come first on game day
  if(!(INSTALL.ios || INSTALL.android || INSTALL.touch)) return false;
  const st=installState();
  if(st.installed || (st.visits||0)<2) return false;
  if(st.dismissed && (Date.now()-st.dismissed < 21*864e5 || (st.count||0)>=3)) return false;
  return true;
}
async function startInstall(from){
  if(INSTALL.prompt){
    const p=INSTALL.prompt; INSTALL.prompt=null;
    track("install_prompt_opened",{platform:INSTALL.platform, from});
    try{
      p.prompt();
      const {outcome}=await p.userChoice;
      track("install_prompt_result",{platform:INSTALL.platform, outcome});
      if(outcome==="accepted") saveInstall({installed:true});
    }catch(e){ S.modal="install"; }
    render(); return;
  }
  track("install_steps_opened",{platform:INSTALL.platform, from});
  S.modal="install"; render();
}
function installBanner(){
  const b=el("div","install"); b.setAttribute("role","region"); b.setAttribute("aria-label","Add to home screen");
  const im=el("div","im"); im.innerHTML=`<svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" fill="var(--color-text)"/><rect x="5" y="5" width="10" height="10" fill="var(--color-accent)"/><rect x="17" y="5" width="10" height="10" fill="var(--color-accent)"/><rect x="5" y="17" width="10" height="10" fill="var(--color-accent)"/><rect x="17" y="17" width="10" height="10" fill="var(--color-neutral-600)"/></svg>`; b.appendChild(im);
  const t=el("div","it");
  t.appendChild(el("div","t","Put AllRosters on your home screen"));
  t.appendChild(el("div","d","One tap to every league on game day. Opens full screen, like an app."));
  b.appendChild(t);
  const go=el("button","btn btn-primary", INSTALL.prompt ? "Add" : "Show me");
  go.onclick=()=>startInstall("banner"); b.appendChild(go);
  const x=el("button","x","×"); x.setAttribute("aria-label","Not now");
  x.onclick=()=>{ const st=installState(); saveInstall({dismissed:Date.now(), count:(st.count||0)+1});
    track("install_banner_dismissed",{platform:INSTALL.platform}); render(); };
  b.appendChild(x);
  if(!INSTALL.shown){ INSTALL.shown=true; track("install_banner_shown",{platform:INSTALL.platform, prompt:!!INSTALL.prompt}); }
  return b;
}

/* ============================================================
   RENDER — league detail
   ============================================================ */
function detailLeague(){ return S.leagues.find(l=>l.id===S.league) || S.leagues[0]; }
function openLeague(id, expandPid, from){
  track("league_opened", {from: from||"card", league_bucket: bucket(S.leagues.length), week: isCurrent() ? "current" : "past"});
  S.view="detail"; S.league=id; S.tab="mine"; S.open=new Set(); S.anim=true;
  if(expandPid){
    const key=`${id}:${expandPid}`;
    S.open.add(key);
    S.reveal={key, mode:"top"};
    if(S.statCache[statKey(expandPid)]===undefined)
      statsFor(expandPid).then(()=>{ if(S.open.has(key)) S.reveal={key, mode:"top"}; render(); });
  }
  render();
}

function mineRows(L, host){
  const st=(L.mine||[]).filter(p=>p.starter);
  const bn=(L.mine||[]).filter(p=>!p.starter&&!p.empty).sort((a,b)=>b.pts-a.pts);
  const cols=el("div","cols");
  const a=el("div","col");
  a.appendChild(headerRow(`STARTING ${st.length}`, `SCORED ${f2(L.myPts)}`));
  st.forEach(p=>pushPlayer(a,p,L,`${L.id}:${p.pid}`));
  cols.appendChild(a);
  if(bn.length){
    const b=el("div","col");
    b.appendChild(headerRow(`BENCH ${bn.length}`, started(L) ? `${f1(benchPts(L))} PTS SAT OUT` : "NOT STARTED"));
    bn.forEach(p=>pushPlayer(b,p,L,`${L.id}:${p.pid}`));
    cols.appendChild(b);
  }
  host.appendChild(cols);

  const w=winProb(L);
  if(!started(L)){
    host.appendChild(headerRow("LEFT ON THE BENCH", "—"));
    host.appendChild(el("div","note","Nothing has been scored yet. Once games start, this shows how many more points your best possible lineup would have scored."));
    return;
  }
  const bs=benchStory(L);
  const gain=bs.gain>=0.05;
  host.appendChild(headerRow("LEFT ON THE BENCH", gain ? "+"+f1(bs.gain) : "NONE", gain));
  host.appendChild(el("div","note", gain && bs.swaps.length
    ? "Best lineup: " + bs.swaps.slice(0,3).join(", ") + "."
    : w && w.decided ? "You played your best possible lineup."
    : "You're playing your best possible lineup so far."));
}
function pushPlayer(host,p,L,key){
  const gl=gameLabel(p.team);
  const proj=projFor(p,L);
  const open=S.open.has(key);
  /* the tint is for problems only; other leagues show as chips */
  const flag=p.empty||isOut(p);
  const slot = p.starter && !p.empty && p.slot && p.slot!==p.pos ? (SLOT_NAME[p.slot]||slotLabel(p.slot)) : "";
  const meta=[slot, [p.pos,p.team].filter(Boolean).join(" "), p.inj||""].filter(Boolean).join(" · ");
  host.appendChild(rowEl({
    pts:f1(p.pts), zero:!p.pts, delta:S.deltas[p.pid], name:p.name, meta, metaAccent:flag,
    chips:p.empty?null:leagueChips(p.pid,L),
    clock:gl.clock, clockSub:gl.sub, live:gl.live, on:open, flag, key,
    onClick:()=>toggle(key,p.empty?null:p.pid)
  }));
  if(open){ const pp=playerPanel(p,L,p.empty?"Nobody assigned":""); pp.classList.add("focus"); host.appendChild(pp); }
}

function clockRows(L, host){
  if(!S.games.length){ host.appendChild(el("div","note","Live game clocks are unreachable right now.")); return; }
  const mine={};
  for(const lg of S.leagues) for(const p of lg.mine||[]){ if(p.empty||!p.team) continue;
    (mine[p.team]=mine[p.team]||[]).push({p,lg}); }
  const order={in:0,pre:1,post:2};
  const count=g=>[...(mine[g.home]||[]),...(mine[g.away]||[])];
  const games=[...S.games].sort((a,b)=>(order[a.state]-order[b.state])
    || (count(b).filter(x=>x.p.starter).length-count(a).filter(x=>x.p.starter).length) || (a.start-b.start));
  for(const g of games){
    const key="clock:"+g.id, open=S.open.has(key);
    const ps=count(g).sort((a,b)=>b.p.pts-a.p.pts);
    const starters=ps.filter(x=>x.p.starter).length;
    host.appendChild(rowEl({
      pts:g.state==="pre"?"—":`${g.awayScore}-${g.homeScore}`, zero:g.state==="pre", wide:true,
      name:`${g.away} AT ${g.home}`,
      meta: g.state==="in" ? `${g.period>4?"OT":"Q"+g.period} ${g.clock}`+(g.dnd?` · ${g.dnd}`:"")+(g.poss?` · ${g.poss} ball`:"")
        : g.state==="post" ? (g.period>4?"Final, overtime · ":"")+timeStr(g.start) : timeStr(g.start),
      metaAccent:g.state==="in", metaWrap:true,
      clock: g.state==="in"?"LIVE":g.state==="post"?"FINAL":"SOON", live:g.state==="in",
      clockSub: `${starters} OF YOURS`, on:open, key,
      onClick:()=>toggle(key)
    }));
    if(open){
      const w=el("div","exp focus");
      const box=el("div","stats"); box.style.marginTop="0";
      const bh=el("div","hd"); bh.appendChild(lb(ps.length?"YOUR PLAYERS IN THIS GAME":"NOBODY OF YOURS IN THIS ONE"));
      if(ps.length){ const r=lb("PTS"); r.classList.add("r"); bh.appendChild(r); }
      box.appendChild(bh);
      for(const {p,lg} of ps){
        const r=el("div","sr");
        r.appendChild(el("span","v",p.starter?lg.key:"—"));
        r.appendChild(el("span","l",`${p.name} · ${[p.pos,p.team].filter(Boolean).join(" ")} · ${lg.name} ${p.starter?"starting":"bench"}`));
        r.appendChild(el("span","p"+(p.pts?"":" none"),f1(p.pts)));
        box.appendChild(r);
      }
      w.appendChild(box);
      const foot=el("div","expfoot");
      const a=el("div"); a.appendChild(lb("STATE")); a.appendChild(el("div","v n",
        g.state==="in"?`${g.period>4?"OT":"Q"+g.period} ${g.clock}`:g.state==="post"?"Final":`Kicks ${hhmm(g.start)}`));
      foot.appendChild(a);
      const b=el("div"); b.appendChild(lb("SCORE")); b.appendChild(el("div","v n",
        g.state==="pre"?"—":`${g.away} ${g.awayScore} · ${g.home} ${g.homeScore}`)); foot.appendChild(b);
      w.appendChild(foot); host.appendChild(w);
    }
  }
}

/* head to head: each lineup slot as one row, one team on the left and the other on the right */
function headToHead(L, A, B, o){
  const bySlot=side=>{ const m=new Map(); for(const p of side||[]) if(p.starter) m.set(p.slotIndex,p); return m; };
  const SA=bySlot(A), SB=bySlot(B);
  const idx=[...new Set([...SA.keys(),...SB.keys()])].sort((x,y)=>x-y);
  const scored=[...(A||[]),...(B||[])].some(p=>p.pts);
  const wrap=el("div","mwrap");
  const isOpen=(p,k)=>!!p && !p.empty && S.open.has(`${k}:${p.pid}`);
  /* inside an opened matchup card with no player open, the whole matchup is the thing in focus */
  const allFocus = o.focusAll && !idx.some(i=>isOpen(SA.get(i),o.keyA)||isOpen(SB.get(i),o.keyB));
  if(o.header){
    const h=headerRow(`${(o.nameA||"Team").toUpperCase()} VS ${(o.nameB||"Team").toUpperCase()}`, `${f2(o.ptsA)} – ${f2(o.ptsB)}`);
    if(allFocus) h.classList.add("focus");
    wrap.appendChild(h);
  }
  for(const i of idx){
    const a=SA.get(i), b=SB.get(i);
    const lead = a && b && scored ? (a.pts>b.pts+0.04 ? "a" : b.pts>a.pts+0.04 ? "b" : "") : "";
    const r=el("div","mrow"+(allFocus||isOpen(a,o.keyA)||isOpen(b,o.keyB)?" focus":""));
    r.appendChild(matchSide(a,L,"a",lead==="a",o.keyA));
    r.appendChild(el("div","mslot",slotShort(L.slots[i]||a?.slot||b?.slot)));
    r.appendChild(matchSide(b,L,"b",lead==="b",o.keyB));
    wrap.appendChild(r);
    for(const [p,k,ctx] of [[a,o.keyA,o.ctxA],[b,o.keyB,o.ctxB]]){
      if(!isOpen(p,k)) continue;
      const pp=playerPanel(p,L,ctx||""); pp.classList.add("focus"); wrap.appendChild(pp);
    }
  }
  return wrap;
}
function themRows(L, host){
  if(!(L.them||[]).length){ host.appendChild(el("div","note","No opponent this week.")); return; }
  host.appendChild(headToHead(L, L.mine, L.them, {header:true, nameA:L.myName||"You", nameB:L.oppName||"Opponent",
    ptsA:L.myPts, ptsB:L.oppPts, keyA:`${L.id}:M`, keyB:`${L.id}:T`, ctxA:"", ctxB:`${L.oppName||"Opponent"} starting`}));
}

/* the week across the league: a card per matchup, yours first; tap one to open its head to head */
function leagueRows(L, host){
  const pairs=L.pairs||[];
  if(!pairs.length){ host.appendChild(el("div","note",`No week ${S.week} matchups are posted in this league.`)); return; }
  host.appendChild(headerRow(`${L.name.toUpperCase()} · WEEK ${S.week}`, `${pairs.length} MATCHUP${pairs.length>1?"S":""}`));
  const grid=el("div","lgames");
  for(const pr of [...pairs].sort((a,b)=>(b.mine-a.mine)||(a.mid-b.mid))){
    const key=`${L.id}:G${pr.mid}`, open=S.open.has(key);
    grid.appendChild(matchCard(L,pr,key,open));
    const [A,B]=pr.teams;
    if(open && B){
      const w=headToHead(L, A.side, B.side, {header:true, focusAll:true, nameA:A.name, nameB:B.name, ptsA:A.pts, ptsB:B.pts,
        keyA:`${key}/a`, keyB:`${key}/b`, ctxA:A.mine?"":`${A.name} starting`, ctxB:`${B.name} starting`});
      w.classList.add("gopen"); grid.appendChild(w);
    }
  }
  host.appendChild(grid);
  if(L.byes?.length) host.appendChild(el("div","note",`On bye this week: ${L.byes.join(", ")}.`));
}
function matchCard(L, pr, key, open){
  const [A,B]=pr.teams;
  const card=el("button","gcard"+(pr.mine?" mine":"")+(open?" on focus":""));
  card.setAttribute("aria-expanded", open);
  card.dataset.key=key;
  card.onclick=()=>toggle(key, null, {name:"matchup_expanded", params:{mine:pr.mine}});
  const d = B ? Math.round((A.pts-B.pts)*100) : 0;
  const team=(t,side)=>{
    const row=el("div","gt");
    if(t.avatar){
      const img=el("img","gav"); img.src=`https://sleepercdn.com/avatars/thumbs/${encodeURIComponent(t.avatar)}`;
      img.alt=""; img.width=24; img.height=24; img.loading="lazy";
      img.onerror=()=>img.replaceWith(el("span","gav",(t.name||"?")[0].toUpperCase()));
      row.appendChild(img);
    }else row.appendChild(el("span","gav",(t.name||"?")[0].toUpperCase()));
    const n=el("div","gn");
    const nm=el("div","nm"); nm.appendChild(el("span",null,t.name));
    if(t.mine) nm.appendChild(el("span","you","YOU"));
    n.appendChild(nm);
    n.appendChild(lb([t.user && t.user!==t.name ? t.user : "", t.record].filter(Boolean).join(" · ")));
    row.appendChild(n);
    const lead = !B || d===0 ? "tie" : (d>0)===(side==="a") ? "lead" : "trail";
    row.appendChild(el("div","v n "+lead, f2(t.pts)));
    return row;
  };
  card.appendChild(team(A,"a"));
  if(!B){ card.appendChild(lb("NO OPPONENT")); return card; }
  card.appendChild(team(B,"b"));
  const w=pairProb(A.side,B.side,A.pts,B.pts,L);
  /* odds only mean something while there's still football to play */
  if(!w.decided){ const bar=el("div","gbar"); const i=el("i"); i.style.width=Math.round(w.p*100)+"%"; bar.appendChild(i); card.appendChild(bar); }
  else card.appendChild(el("div","grule"));
  const foot=el("div","gfoot");
  foot.appendChild(lb(w.decided ? (d>0?"WON":d<0?"LOST":"TIED") : pct(w.p)));
  const live = [...A.side,...B.side].some(p=>p.starter && gameLabel(p.team).live);
  foot.appendChild(lb(w.decided ? "FINAL"
    : started2(A,B) ? `${w.leftA+w.leftB} STARTERS LEFT${live?" · LIVE":""}`
    : `PROJ ${f1(w.projA)} – ${f1(w.projB)}`));
  foot.appendChild(lb(w.decided ? (d<0?"WON":d>0?"LOST":"TIED") : pct(1-w.p)));
  foot.appendChild(el("span","caret",open?"▴":"▾"));
  card.appendChild(foot);
  return card;
}
const started2 = (A,B) => !!(A.pts || B.pts || [...A.side,...B.side].some(p=>p.pts));

function matchSide(p, L, side, lead, prefix){
  if(!p) return el("div","mside "+side);
  const key=`${prefix}:${p.pid}`;
  const b=el(p.empty?"div":"button","mside "+side+(S.open.has(key)?" on":""));
  b.dataset.key=key;
  if(!p.empty) b.onclick=()=>toggle(key,p.pid);
  b.appendChild(el("div","mp n"+(lead?" lead":"")+(p.pts?"":" zero"), p.empty?"—":f1(p.pts)));
  const t=el("div","mt");
  const nm=el("div","nm");
  const parts=String(p.name||"").split(" ");
  nm.appendChild(el("span","full",p.empty?"Empty slot":p.name));
  nm.appendChild(el("span","short",p.empty?"Empty":parts.length>1 && p.pos!=="DEF" ? `${parts[0][0]}. ${parts.slice(1).join(" ")}` : p.name));
  const nr=el("div","nmrow"); nr.appendChild(nm);
  const ch=p.empty?null:leagueChips(p.pid,L); if(ch) nr.appendChild(ch);
  t.appendChild(nr);
  const gl=gameLabel(p.team);
  t.appendChild(el("div","lb ell"+(isOut(p)?" acc":""), p.empty ? "NOBODY" :
    [[p.pos,p.team].filter(Boolean).join(" "), isOut(p)?p.inj:"", gl.clock].filter(Boolean).join(" · ")));
  b.appendChild(t);
  return b;
}

function tableRows(L, host){
  if(!L.rosters){ host.appendChild(el("div","note","Standings unavailable.")); return; }
  const wk=r=>L.matchups.find(x=>x.roster_id===r.roster_id)?.points||0;
  const rows=[...L.rosters].sort((a,b)=>{ const A=a.settings||{},B=b.settings||{};
    return (B.wins-A.wins)||(A.losses-B.losses)
      ||((B.fpts+(B.fpts_decimal||0)/100)-(A.fpts+(A.fpts_decimal||0)/100))||(wk(b)-wk(a)); });
  const t=el("div","stand"); host.appendChild(t); host=t;
  host.appendChild(headerRow(`${L.name.toUpperCase()} · ${rows.length} TEAMS`, `WEEK ${S.week}`));
  rows.forEach((r,i)=>{
    const st=r.settings||{}, me=r.roster_id===L.myRoster?.roster_id;
    host.appendChild(rowEl({
      pts:String(i+1), name:L.teamName(r),
      meta:`${L.userName(r)} · ${f1((st.fpts||0)+(st.fpts_decimal||0)/100)} PF · ${f1(wk(r))} THIS WEEK`,
      clock:`${st.wins??0}-${st.losses??0}`, clockSub:me?"YOU":"RECORD", bigClock:true, flag:me
    }));
  });
}

function renderDetail(d){
  const L=detailLeague();
  d.classList.add("lg"+L.ci);
  const flowy=!S.wide;
  if(flowy){ d.classList.add("flowy","scroll"); d.dataset.k=`detail:${L.id}`; }

  /* wide keeps home open beside this, so neither control has anything to do */
  if(!S.wide){
    const back=el("button","back");
    back.onclick=()=>{ S.view="home"; S.open=new Set(); render(); };
    back.appendChild(el("span","t","‹ ALL LEAGUES"));
    const f=lb(L.name.toUpperCase(),"lgc"); f.style.marginLeft="auto"; back.appendChild(f);
    d.appendChild(back);
  }

  if(!S.wide && S.leagues.length>1){
    const sw=el("div",(S.leagues.length>2?"strip":"grid2")+" switch");
    sw.dataset.x="switch";
    for(const x of S.leagues){
      const b=el("button","sw lg"+x.ci); b.setAttribute("aria-pressed",x.id===L.id);
      b.onclick=()=>openLeague(x.id,null,"switcher");
      const nm=el("div","nm"); nm.appendChild(chip(x)); nm.appendChild(el("span","ell",x.name.toUpperCase()));
      b.appendChild(nm);
      b.appendChild(lb(`${x.record||"—"} · ${statusOf(x)}`));
      sw.appendChild(b);
    }
    d.appendChild(sw);
  }

  const w=winProb(L);
  const sc=el("div","score");
  const body=el("div","body");
  /* which league this is, in its own color; the phone switcher above already says so */
  if(S.wide || S.leagues.length<2){
    const lh=el("div","lghead");
    if(L.avatar){
      const img=el("img"); img.src=`https://sleepercdn.com/avatars/thumbs/${encodeURIComponent(L.avatar)}`;
      img.alt=""; img.width=24; img.height=24; img.loading="lazy"; img.onerror=()=>img.replaceWith(chip(L));
      lh.appendChild(img);
    }else lh.appendChild(chip(L));
    lh.appendChild(el("span","t",L.name.toUpperCase()));
    lh.appendChild(lb(L.record||""));
    body.appendChild(lh);
  }
  if(L.error || !L.hasMatchup){
    body.appendChild(lb("THIS LEAGUE"));
    body.appendChild(el("div","big n","—"));
    body.appendChild(lb(L.error || `NO WEEK ${S.week} MATCHUP POSTED`));
  }else{
    body.appendChild(lb(`ME · ${L.myName}`,"lgc"));
    const lead=leader(L), size=side=>lead==="tie"?" tie":lead===side?"":" trail";
    body.appendChild(el("div","big n"+size("me"),f2(L.myPts)));
    body.appendChild(lb(w?`PROJ ${f1(w.projMe)} · ${w.left} OF ${w.total} STARTERS LEFT`:"—"));
    body.appendChild(el("div","srule"));
    body.appendChild(lb(`THEM · ${L.oppName||"Opponent"}`));
    body.appendChild(el("div","big n"+size("them"),f2(L.oppPts)));
    body.appendChild(lb(w?`PROJ ${f1(w.projOpp)} · ${w.oppLeft} LEFT`:"—"));
    /* ahead on the board but behind in the odds (or the reverse) reads like a bug unless it's explained */
    if(w && !w.decided){
      const l=leader(L);
      const why = l==="me" && w.p<0.5 ? "THEY HAVE MORE PROJECTED POINTS LEFT TO PLAY"
                : l==="them" && w.p>0.5 ? "YOU HAVE MORE PROJECTED POINTS LEFT TO PLAY" : "";
      if(why){ const h=lb(why); h.classList.add("why"); body.appendChild(h); }
    }
  }
  sc.appendChild(body);
  if(w){
    const g=el("div","gauge");
    g.appendChild(el("div","gp n", w.decided ? (w.margin>0?"WON":w.margin<0?"LOST":"TIE") : pct(w.p)));
    g.appendChild(lb(w.decided ? "FINAL" : "TO WIN"));
    const on=Math.round(w.p*10);
    for(let i=0;i<10;i++) g.appendChild(el("i", i>=10-on ? "on" : null));
    sc.appendChild(g);
  }
  d.appendChild(sc);

  const tabs=el("div","tabs");
  [["LINEUP","mine"],["MATCHUP","them"],["LEAGUE","league"],["STANDINGS","table"],["NFL","clocks"]].forEach(([label,val])=>{
    const b=el("button",null,label); b.setAttribute("aria-selected",S.tab===val); b.setAttribute("role","tab");
    b.onclick=()=>{
      if(S.tab!==val) track("tab_viewed", {tab: label.toLowerCase()});
      if(flowy) S.tabJump=d.scrollTop;          // the new tab should start under the tabs, not mid-list
      S.tab=val; S.open=new Set(); render();
    };
    tabs.appendChild(b);
  });
  tabs.setAttribute("role","tablist");
  if(flowy){
    const stick=el("div","dstick");
    const mini=el("button","mini"); mini.setAttribute("aria-label","Back to the top of this league");
    mini.appendChild(chip(L));
    if(!L.error && L.hasMatchup){
      const lead=leader(L);
      mini.appendChild(lb("YOU"));
      mini.appendChild(el("span","ms"+(lead!=="them"?" lead":""),f2(L.myPts)));
      mini.appendChild(el("span","dash","–"));
      mini.appendChild(el("span","ms"+(lead!=="me"?" lead":""),f2(L.oppPts)));
      mini.appendChild(lb("THEM"));
      const ml=lb(w ? (w.decided ? statusOf(L) : pct(w.p)+" TO WIN") : "","mw");
      mini.appendChild(ml);
    }else{
      const nm=lb(L.name.toUpperCase(),"lgc"); mini.appendChild(nm);
      mini.appendChild(el("span","mw",""));
    }
    mini.appendChild(el("span","up","↑"));
    mini.onclick=()=>d.scrollTo({top:0,behavior:"smooth"});
    stick.appendChild(mini); stick.appendChild(tabs); d.appendChild(stick);
    /* the bar takes over when 44px of score is left, exactly covering it, so the tabs never move */
    /* measured from the score block: a stuck element's offsetTop reports where it's stuck, not where it sits */
    d._tabTop=()=>sc.offsetTop+sc.offsetHeight-44;
    d._sync=()=>{ stick.classList.toggle("stuck", d.scrollTop >= d._tabTop()); };
    d.addEventListener("scroll", d._sync, {passive:true});
  }else d.appendChild(tabs);

  const list=el("div","list"+(flowy?"":" scroll")+(S.wide?" wide":""));
  if(!flowy) list.dataset.k=`list:${L.id}:${S.tab}`;
  const host = S.tab==="clocks" ? list.appendChild(el("div","flow")) : list;
  ({mine:mineRows,clocks:clockRows,them:themRows,league:leagueRows,table:tableRows}[S.tab])(L,host);
  if(list.querySelector(".focus")) list.classList.add("has-open");
  d.appendChild(list);

}

      const f4=el("div","field"); f4.style.margin="16px 0 0";
      const l4=el("label",null,"Your scoreboard link"); l4.htmlFor="ulink"; f4.appendChild(l4);
      const row=el("div","linkrow");
      const link=el("input","input"); link.id="ulink"; link.readOnly=true; link.value=userLink();
      link.onfocus=()=>link.select();
      const cp=el("button","btn btn-secondary","Copy");
      cp.onclick=async()=>{
        try{ await navigator.clipboard.writeText(link.value); cp.textContent="Copied"; }
        catch(e){ link.focus(); link.select(); cp.textContent="Press ⌘C"; }
        setTimeout(()=>cp.textContent="Copy",1800);
      };
      row.appendChild(link); row.appendChild(cp); f4.appendChild(row);
      f4.appendChild(el("div","hint","Bookmark it, or open it on another device, to bring your leagues straight back."));
      m.appendChild(f4);
    }

    const rl=el("button","btn btn-secondary btn-block","Reload player database");
    rl.onclick=()=>{ store.set("sb_players",null); S.modal=null; refresh(false); };
    m.appendChild(rl);
    if(!INSTALL.standalone){
      const ins=el("button","btn btn-secondary btn-block","Add AllRosters to your home screen");
      ins.onclick=()=>{ S.modal=null; startInstall("settings"); };
      m.appendChild(ins);
    }
    if(S.cfg.username){
      const fg=el("button","btn btn-secondary btn-block","Use a different Sleeper account");
      fg.onclick=forgetUser; m.appendChild(fg);
    }
    m.appendChild(el("div","note","These settings live in this browser only. Sleeper's API is read-only, so lineups and waivers still happen in the Sleeper app."));
  });
}
